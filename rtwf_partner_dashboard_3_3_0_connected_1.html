  function csvCell(v) {
    var s = (v === null || v === undefined) ? "" : String(v);
    return '"' + s.replace(/"/g, '""') + '"';
  }
  function exportCsv() {
    var rows = sortPartners(getFilteredPartners());
    var header = ["Organization", "Org Type", "Region", "Disease", "Gene", "Research Stage",
      "Top Support Need", "Primary Contact", "Email", "Phone", "Last Interaction",
      "Next Meeting", "Cadence", "Open Follow-Up", "Anomaly Flags"];
    var lines = [header.map(csvCell).join(",")];
    rows.forEach(function (p) {
      lines.push([
        p.orgName, p.orgType, p.region, p.disease, p.data.disease.gene, p.stage,
        p.topNeed, p.data.contact.name, p.data.contact.email, p.data.contact.phone,
        p.lastInteraction, p.data.meeting.next || "", p.data.meeting.cadence,
        p.followUpOpen ? "Yes" : "No",
        p.flags.map(function (f) { return FLAG_META[f].label; }).join("; ")
      ].map(csvCell).join(","));
    });
    var blob = new Blob([lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rtwf_partners_" + rows.length + "_of_" + PARTNERS.length + ".csv";
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  function clearAllFilters() {
    state.search = ""; state.stage = ""; state.category = "";
    state.need = ""; state.orgType = ""; state.region = "";
    state.quick = ""; state.sort = "flagged";
    byId("paletteInput").value = "";
  }

  /* =====================================================
     COMPONENT: BENTO GRID
  ===================================================== */
  var STAGE_SHORT = {
    "Discovery": "Discovery",
    "Natural History Study": "Nat. History",
    "Preclinical": "Preclinical",
    "Clinical Trials": "Clinical Trials",
    "Approved Therapy": "Approved"
  };

  /* Inline SVG stage journey: five segments, filled to the current stage */
  function stageBarSvg(p) {
    var idx = STAGE_ORDER.indexOf(p.stage);
    var segW = 100 / STAGE_ORDER.length;
    var segs = STAGE_ORDER.map(function (s, i) {
      var on = i <= idx;
      var x = (i * segW).toFixed(2);
      var w = (segW - 1.6).toFixed(2);
      return '<rect ' + (on ? 'class="seg-on" ' : '') + 'x="' + x + '%" y="0" width="' + w + '%" height="8" rx="3" ' +
        'style="fill:' + (on ? STAGE_STYLE[STAGE_ORDER[i]].color : 'var(--bg-deep)') +
        (on ? '; animation-delay:' + (i * 0.06) + 's' : '') + ';"></rect>';
    }).join("");
    return (
      '<div class="stagebar">' +
        '<div class="stagebar-caption"><span class="cur">' + escapeHtml(STAGE_SHORT[p.stage] || p.stage) + '</span>' +
        '<span class="tabular">Stage ' + (idx + 1) + ' of ' + STAGE_ORDER.length + '</span></div>' +
        '<svg preserveAspectRatio="none" aria-hidden="true">' + segs + '</svg>' +
      '</div>'
    );
  }

  function partnerCardHtml(p, i) {
    var tier = highestTier(p);
    var activeFlags = getActiveFlags(p);

    var beaconHtml = "";
    if (tier) {
      var ts = TIER_STYLE[tier];
      beaconHtml =
        '<span class="beacon' + (tier === "critical" ? " beacon--critical" : "") + '" style="color:' + ts.color + ';" ' +
          'title="' + TIER_LABEL[tier] + ' — ' + activeFlags.map(function (f) { return FLAG_META[f].label; }).join(", ") + '">' +
          '<span class="beacon-dot" style="background:' + ts.color + ';"></span>' +
          '<span class="tabular">' + activeFlags.length + '</span>' +
        '</span>';
    }

    var delay = prefersReduced ? 0 : Math.min(i, 14) * 0.035;

    return (
      '<div class="pcard" data-id="' + p.id + '" tabindex="0" role="button" ' +
        'aria-label="Open profile for ' + escapeAttr(p.orgName) + '" ' +
        'style="--card-accent:' + STAGE_STYLE[p.stage].color + '; animation-delay:' + delay + 's;">' +
        '<div class="pcard-top">' +
          avatarHtml(p.orgName, false) +
          '<div style="min-width:0;">' +
            '<div class="pcard-org">' + escapeHtml(p.orgName) + '</div>' +
            '<div class="pcard-meta" title="' + escapeAttr(p.orgType + ' · ' + p.region) + '">' +
              escapeHtml(p.orgType) + ' · ' + escapeHtml(p.region) + '</div>' +
          '</div>' +
          beaconHtml +
        '</div>' +
        '<div class="pcard-disease">' + escapeHtml(p.disease) +
          '<span class="gene">' + escapeHtml(p.data.disease.gene) + '</span></div>' +
        stageBarSvg(p) +
        '<div class="pcard-foot">' +
          '<span class="need" title="' + escapeAttr(p.topNeed) + '">' + escapeHtml(p.topNeed) + '</span>' +
          '<span class="tabular" title="Last interaction">↺ ' + formatDate(p.lastInteraction) + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  function renderGrid() {
    var el = byId("bentoGrid");
    if (PARTNERS.length === 0) {
      el.innerHTML =
        '<div class="empty-state">' +
          '<div style="font-size:2rem; margin-bottom:var(--sp-4);">🗂</div>' +
          '<strong>No partner records yet.</strong><br>' +
          'Partner records will appear here automatically when intake forms are submitted.<br>' +
          '<span style="font-size:var(--fs-xs); color:var(--muted); display:block; margin-top:var(--sp-2);">Records are loaded from the intake pipeline — no data entry required.</span>' +
        '</div>';
      return;
    }
    var filtered = sortPartners(getFilteredPartners());
    if (filtered.length === 0) {
      el.innerHTML =
        '<div class="empty-state">No partners match the current filters.<br>' +
        '<button type="button" class="btn" id="emptyClearBtn">Clear all filters</button></div>';
      return;
    }
    el.innerHTML = filtered.map(partnerCardHtml).join("");
  }

  /* =====================================================
     COMPONENT: COMMAND PALETTE (⌘K)
  ===================================================== */
  var PALETTE_MAX_RESULTS = 8;

  function fchip(key, value, label, on) {
    return '<button type="button" class="fchip' + (on ? ' on' : '') + '" data-fkey="' + key + '" data-fval="' +
      escapeAttr(value) + '">' + escapeHtml(label) + '</button>';
  }

  function renderPalette() {
    if (!state.paletteOpen) return;   // don't burn cycles while hidden

    var body = byId("paletteBody");
    var results = sortPartners(getFilteredPartners()).slice(0, PALETTE_MAX_RESULTS);
    if (state.paletteIndex >= results.length) state.paletteIndex = Math.max(0, results.length - 1);

    var stageChips = STAGE_ORDER.map(function (s) { return fchip("stage", s, s, state.stage === s); }).join("");
    var catChips = uniqueSorted(PARTNERS.map(function (p) { return p.diseaseCategory; }))
      .map(function (c) { return fchip("category", c, c, state.category === c); }).join("");
    var needChips = uniqueSorted(PARTNERS.map(function (p) { return p.topNeed; }))
      .map(function (n) { return fchip("need", n, n, state.need === n); }).join("");
    var orgChips = uniqueSorted(PARTNERS.map(function (p) { return p.orgType; }))
      .map(function (t) { return fchip("orgType", t, t, state.orgType === t); }).join("");
    var regionChips = uniqueSorted(PARTNERS.map(function (p) { return p.region; }))
      .map(function (r) { return fchip("region", r, r, state.region === r); }).join("");
    var quickChips =
      fchip("quick", "flagged", "\u26a0 Flagged partners", state.quick === "flagged") +
      fchip("quick", "upcoming", "\ud83d\udcc5 Upcoming meetings", state.quick === "upcoming") +
      fchip("quick", "followups", "\u21ba Open follow-ups", state.quick === "followups");
    var sortChips =
      fchip("sort", "flagged", "Most flagged", state.sort === "flagged") +
      fchip("sort", "name", "Name A–Z", state.sort === "name") +
      fchip("sort", "recent", "Most recent", state.sort === "recent");

    var resultHtml = results.length
      ? results.map(function (p, i) {
          var st = STAGE_STYLE[p.stage];
          return '<button type="button" class="presult' + (i === state.paletteIndex ? ' active' : '') + '" data-open="' + p.id + '">' +
            avatarHtml(p.orgName, true) +
            '<span style="min-width:0;"><span class="p-org">' + escapeHtml(p.orgName) + '</span><br>' +
            '<span class="p-sub">' + escapeHtml(p.disease) + '</span></span>' +
            '<span class="p-stage stage-badge text-' + st.text + '" style="background:' + st.color + ';">' +
              escapeHtml(STAGE_SHORT[p.stage] || p.stage) + '</span>' +
          '</button>';
        }).join("")
      : '<div class="presult-empty">No partners match — press <b>Clear all</b> below or loosen a filter.</div>';

    body.innerHTML =
      '<div class="palette-section-label">Partners · ↑↓ to navigate, ⏎ to open</div>' + resultHtml +
      '<div class="palette-section-label">Quick views</div><div class="fchips">' + quickChips + '</div>' +
      '<div class="palette-section-label">Research stage</div><div class="fchips">' + stageChips + '</div>' +
      '<div class="palette-section-label">Disease category</div><div class="fchips">' + catChips + '</div>' +
      '<div class="palette-section-label">Top support need</div><div class="fchips">' + needChips + '</div>' +
      '<div class="palette-section-label">Organization type</div><div class="fchips">' + orgChips + '</div>' +
      '<div class="palette-section-label">Region</div><div class="fchips">' + regionChips + '</div>' +
      '<div class="palette-section-label">Sort order</div><div class="fchips">' + sortChips +
        '<button type="button" class="fchip" data-clear-all>✕ Clear all</button></div>';
  }

  function openPalette() {
    state.paletteIndex = 0;
    state.paletteOpen = true;
    byId("paletteOverlay").classList.add("open");
    document.body.classList.add("modal-open");
    renderPalette();
    byId("paletteInput").focus();
    byId("paletteInput").select();
  }

  function closePalette() {
    state.paletteOpen = false;
    byId("paletteOverlay").classList.remove("open");
    if (!state.activePartnerId) document.body.classList.remove("modal-open");
    byId("paletteBtn").focus();
  }

  /* =====================================================
     COMPONENT: SLIDE-OVER PROFILE + ACTION CENTER
  ===================================================== */
  /* The seven cadence values that actually occur in the dataset — the
     Cadence field edits as a dropdown so free-typed variants can't break
     the (lapsed)/"Not yet established" scheduling copy in nextMeetingText. */
  var CADENCE_OPTIONS = [
    "Monthly", "Monthly (onboarding)", "Bi-monthly", "Quarterly",
    "Quarterly (lapsed)", "Semi-annual", "Not yet established"
  ];

  function fieldBlock(label, value, opts) {
    opts = opts || {};
    if (state.editMode && opts.path) {
      var raw = opts.rawValue !== undefined ? opts.rawValue : (getPath(currentEditPartner, opts.path) || "");
      var inputHtml;
      if (opts.type === "textarea") {
        inputHtml = '<textarea class="edit-input" data-path="' + opts.path + '" rows="' + (opts.rows || 3) + '">' + escapeAttr(raw) + '</textarea>';
      } else if (opts.type === "date") {
        inputHtml = '<input class="edit-input" data-path="' + opts.path + '" type="date" value="' + escapeAttr(raw) + '">';
      } else if (opts.type === "number") {
        inputHtml = '<input class="edit-input" data-path="' + opts.path + '" data-numeric="true" type="number" value="' + escapeAttr(raw) + '">';
      } else if (opts.type === "select") {
        var optList = (opts.options || []).slice();
        if (raw && optList.indexOf(raw) === -1) optList.unshift(raw);   // never lose an off-list value
        inputHtml = '<select class="edit-input" data-path="' + opts.path + '">' +
          optList.map(function (o) {
            return '<option value="' + escapeAttr(o) + '"' + (o === raw ? ' selected' : '') + '>' + escapeHtml(o) + '</option>';
          }).join("") + '</select>';
      } else {
        inputHtml = '<input class="edit-input" data-path="' + opts.path + '" type="text" value="' + escapeAttr(raw) + '">';
      }
      return '<div class="field"><div class="field-label">' + label + '</div>' + inputHtml + '</div>';
    }
    var cls = "field-value" + (opts.missing ? " missing" : "");
    return '<div class="field"><div class="field-label">' + label + '</div>' +
      '<div class="' + cls + '">' + (value || "&mdash; Not on file") + '</div></div>';
  }

  function tagList(items, variant, opts) {
    opts = opts || {};
    if (state.editMode && opts.path) {
      var raw = (items || []).join(", ");
      return '<textarea class="edit-input" data-path="' + opts.path + '" data-array="true" rows="2" placeholder="Comma-separated list">' + escapeAttr(raw) + '</textarea>';
    }
    if (!items || items.length === 0) return '<div class="field-value missing">None on file</div>';
    var cls = variant === "need" ? "tag tag-need" : "tag";
    return '<div class="tag-list">' + items.map(function (i) { return '<span class="' + cls + '">' + escapeHtml(i) + '</span>'; }).join("") + '</div>';
  }

  function arrayFieldBlock(label, items, opts) {
    opts = opts || {};
    if (state.editMode && opts.path) {
      return '<div class="field"><div class="field-label">' + label + '</div>' +
        '<textarea class="edit-input" data-path="' + opts.path + '" data-array="true" rows="2" placeholder="Comma-separated">' + escapeAttr((items || []).join(", ")) + '</textarea></div>';
    }
    var text = (items && items.length) ? items.map(function (i) { return escapeHtml(i); }).join(", ") : null;
    return fieldBlock(label, text, { missing: !items || items.length === 0 });
  }

  function nextMeetingText(cadence) {
    if (!cadence || cadence.indexOf("Not yet established") !== -1) {
      return "Self-service scheduling isn\u2019t configured yet for this partner.";
    }
    if (/lapsed/i.test(cadence)) {
      var base = cadence.replace(/\s*\(lapsed\)/i, "");
      return "Self-service scheduling is paused \u2014 the " + base + " cadence has lapsed; manual outreach needed.";
    }
    return "Next scheduling email sends automatically per " + cadence + " cadence.";
  }

  function renderMeetingSummary(lastSummary, path) {
    if (state.editMode) {
      var raw = Array.isArray(lastSummary) ? lastSummary.join("\n") : (lastSummary || "");
      return '<div class="field"><div class="field-label">Last Meeting Summary</div>' +
        '<textarea class="edit-input" data-path="' + path + '" data-lines="true" rows="4" placeholder="One point per line">' + escapeAttr(raw) + '</textarea></div>';
    }
    if (Array.isArray(lastSummary) && lastSummary.length) {
      return '<div class="field"><div class="field-label">Last Meeting Summary</div>' +
        '<ul class="summary-bullets">' + lastSummary.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join("") + '</ul></div>';
    }
    return fieldBlock("Last Meeting Summary", lastSummary ? escapeHtml(lastSummary) : null, { missing: !lastSummary });
  }

  function renderNonprofitStatus(status, path) {
    if (state.editMode) {
      var isActiveNow = /^501\(c\)\(3\)\s*\u2014\s*Active/.test(status || "");
      // Checkbox drives the common case (Active ⇄ Application Pending);
      // the text field stays editable for fiscal-sponsorship statuses.
      return '<div class="field"><div class="field-label">Nonprofit Status</div>' +
        '<div class="np-edit-row">' +
          '<label><input type="checkbox" class="np-active-toggle"' + (isActiveNow ? ' checked' : '') + '> Active 501(c)(3)</label>' +
          '<div style="flex:1; min-width:0;">' +
            '<input class="edit-input np-status-text" data-path="' + path + '" type="text" value="' + escapeAttr(status) + '">' +
            '<div class="np-hint">Check/uncheck to toggle Active status, or type a custom status (e.g. fiscal sponsorship).</div>' +
          '</div>' +
        '</div></div>';
    }
    var isActive = /^501\(c\)\(3\)\s*\u2014\s*Active/.test(status || "");
    return '<div class="field"><div class="field-label">Nonprofit Status</div>' +
      '<div class="field-value nonprofit-status-row">' +
        '<span class="checkbox-indicator' + (isActive ? " is-checked" : "") + '" aria-hidden="true">' + (isActive ? "\u2713" : "") + '</span>' +
        '<span>' + escapeHtml(status) + '</span></div></div>';
  }

  function onePagerDemoLink() {
    return '<a href="#" class="onepager-link demo-link" ' +
      'data-demo-title="View Disease One-Pager" ' +
      'data-demo-msg="This will pull the live disease one-pager PDF from OneDrive when the backend integration is complete." ' +
      'title="Coming soon \u2014 connects to OneDrive when the backend is live.">' +
      'View Disease One-Pager (PDF) &#8599;</a>';
  }

  function renderFlagsCallout(p) {
    var active = getActiveFlags(p);
    var resolvedMap = FLAG_RESOLVED[p.id] || {};
    var resolvedKeys = p.flags.filter(function (f) { return resolvedMap[f]; });

    /* Resolved flags collapsible (shown in both clean and active states) */
    var resolvedHtml = "";
    if (resolvedKeys.length > 0) {
      var rItems = resolvedKeys.map(function (f) {
        var meta = FLAG_META[f];
        var r = resolvedMap[f];
        return '<div class="resolved-flag-item">' +
          '<div class="resolved-flag-name">\u2713 ' + meta.label + '</div>' +
          '<div class="resolved-flag-note">' + escapeHtml(r.note) + '</div>' +
          '<div class="resolved-flag-date">Resolved ' + escapeHtml(r.date) + '</div>' +
        '</div>';
      }).join("");
      resolvedHtml = '<details class="resolved-flags"><summary>' +
        resolvedKeys.length + ' resolved flag' + (resolvedKeys.length === 1 ? '' : 's') +
        '</summary>' + rItems + '</details>';
    }

    /* All flags resolved → clean state */
    if (active.length === 0) {
      return '<div class="flags-callout is-clean"><h4>\u2713 No Active Anomaly Flags</h4>' +
        '<p class="clean-note">This partner record is complete against RTWF\u2019s standard data checks.</p>' +
        resolvedHtml + '</div>';
    }

    /* Active flags with Resolve buttons */
    var sortedFlags = active.slice().sort(function (a, b) {
      return TIER_RANK[FLAG_META[b].tier] - TIER_RANK[FLAG_META[a].tier];
    });
    var items = sortedFlags.map(function (f) {
      var meta = FLAG_META[f];
      var ts = TIER_STYLE[meta.tier];
      return '<li>' +
        '<span class="flag-text"><span class="tier-label" style="background:' + ts.bg + '; color:' + ts.color + '; border-color:' + ts.border + ';">' +
          TIER_LABEL[meta.tier] + '</span><strong>' + meta.label + '</strong> \u2014 ' + meta.desc(p) + '</span>' +
        '<button type="button" class="flag-resolve-btn" ' +
          'data-resolve-partner="' + escapeAttr(p.id) + '" ' +
          'data-resolve-flag="' + escapeAttr(f) + '">Resolve</button>' +
      '</li>';
    }).join("");

    return '<div class="flags-callout">' +
      '<h4>\u26a0 Anomaly Flags (' + active.length + ')</h4>' +
      '<ul>' + items + '</ul>' +
      resolvedHtml + '</div>';
  }

  /* ── Action Center: agenda items as an interactive timeline ──────
     Items carry their ORIGINAL agenda index in data attributes so
     completion + owner state (AC_SESSION) survives re-renders and
     stays stable as items disappear. Visible numbering re-flows. */
  function renderActionCenter(p) {
    var agendaItems = buildAgendaItems(p);
    var expanded = state.agendaExpanded;
    var session = acFor(p.id);

    var doneCount = 0;
    var visible = [];
    agendaItems.forEach(function (item, idx) {
      if (session.done[idx]) doneCount++;
      else visible.push({ item: item, idx: idx });
    });

    var itemsHtml = visible.map(function (entry, vi) {
      var item = entry.item, idx = entry.idx;
      var savedOwner = session.owners[idx] || "";
      var ownerOptionsHtml = OWNER_OPTIONS.map(function (name) {
        return '<option value="' + escapeAttr(name) + '"' + (savedOwner === name ? ' selected' : '') + '>' + escapeHtml(name) + '</option>';
      }).join("") + '<option value="' + escapeAttr(p.orgName) + '"' + (savedOwner === p.orgName ? ' selected' : '') + '>' +
        escapeHtml(p.orgName) + ' (partner)</option>';

      return (
        '<li class="ac-item" style="animation-delay:' + (prefersReduced ? 0 : vi * 0.05) + 's;">' +
          '<span class="ac-node tabular" aria-hidden="true">' + (vi + 1) + '</span>' +
          '<div class="ac-discussion">' + item.discussion + '</div>' +
          '<div class="ac-action-row">' +
            '<button type="button" class="ac-check" data-ac-done="' + idx + '" ' +
              'aria-label="Mark action item ' + (vi + 1) + ' complete" title="Mark complete">\u2713</button>' +
            '<span class="ac-action-label">Action</span>' +
            '<span class="ac-action-text">' + item.action + '</span>' +
            '<span class="ac-owner">' +
              '<span class="owner-avatar-slot" data-avatar-slot>' + (savedOwner ? avatarHtml(savedOwner, true) : '') + '</span>' +
              '<select class="owner-select" data-ac-owner="' + idx + '" aria-label="Assign owner for action item ' + (vi + 1) + '">' +
                '<option value=""' + (savedOwner ? '' : ' selected') + ' disabled>Assign owner&hellip;</option>' + ownerOptionsHtml +
              '</select>' +
            '</span>' +
          '</div>' +
        '</li>'
      );
    }).join("");

    var bodyInner;
    if (visible.length === 0) {
      bodyInner = '<p class="ac-empty-note">\u2713 All ' + agendaItems.length + ' action items completed for this session.</p>';
    } else {
      bodyInner = '<ol class="ac-timeline">' + itemsHtml + '</ol>';
    }
    if (doneCount > 0) {
      bodyInner +=
        '<div class="ac-completed-row">\u2713 ' + doneCount + ' item' + (doneCount === 1 ? '' : 's') + ' completed this session' +
        '<button type="button" class="btn" data-ac-restore>Restore</button></div>';
    }
    bodyInner +=
      '<div style="margin-top:var(--sp-4);">' +
        '<button type="button" class="btn" data-ac-copy title="Copy the remaining agenda as formatted text for Outlook or OneNote">\u29c9 Copy agenda</button>' +
      '</div>';

    return (
      '<div class="action-center" id="actionCenter">' +
        '<button class="ac-toggle" id="acToggle" aria-expanded="' + (expanded ? "true" : "false") + '" aria-controls="acBody">' +
          '<span class="ai-badge">AI Drafted</span> Meeting Agenda &amp; Action Center' +
          '<span class="chev" aria-hidden="true">\u25be</span>' +
        '</button>' +
        '<div class="ac-body" id="acBody"' + (expanded ? "" : " hidden") + '>' +
          bodyInner +
          '<p class="ac-footnote">Auto-generated from this partner\u2019s current research stage, top support need, and active anomaly flags. Review and edit before sending. Check-offs and owner assignment are for this session only.</p>' +
        '</div>' +
      '</div>'
    );
  }

  /* Re-render just the Action Center in place (used by check-off/restore
     so the rest of the profile — including open edit fields — is untouched). */
  function refreshActionCenter() {
    var p = getPartner(state.activePartnerId);
    var el = byId("actionCenter");
    if (!p || !el) return;
    el.outerHTML = renderActionCenter(p);
  }

  /* Plain-text agenda for the clipboard — respects session check-offs
     and owner assignments so what you paste matches what you see. */
  function agendaAsText(p) {
    var session = acFor(p.id);
    var items = buildAgendaItems(p).map(function (item, idx) { return { item: item, idx: idx }; })
      .filter(function (e) { return !session.done[e.idx]; });
    var lines = ["Meeting Agenda \u2014 " + p.orgName, "Prepared via RTWF Partner RM", ""];
    lines.push("DISCUSSION TOPICS");
    items.forEach(function (e, i) { lines.push((i + 1) + ". " + e.item.discussion); });
    lines.push("", "ACTION ITEMS");
    items.forEach(function (e) {
      var owner = session.owners[e.idx];
      lines.push("[ ] " + e.item.action + (owner ? "  (Owner: " + owner + ")" : ""));
    });
    return lines.join("\n");
  }

  function copyAgenda(btn) {
    var p = getPartner(state.activePartnerId);
    if (!p) return;
    var text = agendaAsText(p);
    function feedback(ok) {
      var original = btn.innerHTML;
      btn.innerHTML = ok ? "\u2713 Copied" : "Copy failed";
      setTimeout(function () { btn.innerHTML = original; }, 1500);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { feedback(true); }, function () { feedback(legacyCopy(text)); });
    } else {
      feedback(legacyCopy(text));
    }
  }
  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    ta.remove();
    return ok;
  }

  /* Re-render slide-over content, preserving scroll position across
     edit-mode toggles so long profiles don't jump back to the top. */
  function renderSlideOver() {
    var p = getPartner(state.activePartnerId);
    if (!p) return;
    currentEditPartner = p;

    var panel = byId("slideOver");
    var scroller = byId("soScroll");
    var keepScroll = scroller.scrollTop;

    // Dynamic accent: tint the panel from the partner's research stage.
    // color-mix derives the soft tint; unsupported browsers silently keep
    // the root fallback (--dyn-soft: var(--accent-soft)).
    var accent = stageAccent(p.stage);
    panel.style.setProperty("--dyn", accent);
    // Provide a pre-set fallback; color-mix() is validated at property-use time so
    // old browsers would silently drop it — set accent-soft first, then override
    // with color-mix only if the browser supports it.
    panel.style.setProperty("--dyn-soft", "var(--accent-soft)");
    if (CSS && CSS.supports && CSS.supports("color", "color-mix(in srgb, red 13%, blue)")) {
      panel.style.setProperty("--dyn-soft", "color-mix(in srgb, " + accent + " 13%, var(--card))");
    }

    scroller.innerHTML = '<div class="so-inner">' + profileHtml(p) + '</div>';
    scroller.scrollTop = keepScroll;
  }

  function openSlideOver(partnerId, sourceEl) {
    lastFocusedCard = sourceEl || null;
    state.editMode = false;
    state.agendaExpanded = true;
    state.activePartnerId = partnerId;   // triggers renderSlideOver via store
    byId("slideOver").classList.add("open");
    byId("soScrim").classList.add("open");
    document.body.classList.add("modal-open");
    byId("soScroll").scrollTop = 0;
    // Move focus into the dialog once content exists (renders on microtask)
    setTimeout(function () {
      var closeBtn = byId("soCloseBtn");
      if (closeBtn) closeBtn.focus();
    }, 60);
  }

  function closeSlideOver() {
    state.activePartnerId = null;
    state.editMode = false;
    byId("slideOver").classList.remove("open");
    byId("soScrim").classList.remove("open");
    if (!state.paletteOpen) document.body.classList.remove("modal-open");
    if (lastFocusedCard && document.contains(lastFocusedCard)) lastFocusedCard.focus();
  }

  function saveProfileEdits() {
    var p = currentEditPartner;
    if (!p) return;
    byId("soScroll").querySelectorAll(".edit-input").forEach(function (el) {
      var path = el.getAttribute("data-path");
      if (!path) return;
      var val;
      if (el.hasAttribute("data-array")) {
        val = el.value.split(",").map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
      } else if (el.hasAttribute("data-lines")) {
        val = el.value.split("\n").map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
      } else if (el.hasAttribute("data-numeric")) {
        val = parseInt(el.value, 10);
        if (isNaN(val)) val = 0;
      } else {
        val = el.value.trim();
        if (val === "") val = null;
      }
      setPath(p, path, val);
    });
    state.editMode = false;
    state.dataVersion = state.dataVersion + 1;   // grid + metrics + profile refresh
  }

  /* ── Anomaly Flags page: grouped by severity tier ─────────────── */
  function renderFlagsPage() {
    var instances = [];
    PARTNERS.forEach(function (p) {
      getActiveFlags(p).forEach(function (f) { instances.push({ p: p, key: f, meta: FLAG_META[f] }); });
    });

    var tierOrder = ["critical", "medium", "info"];
    var byTier = { critical: [], medium: [], info: [] };
    instances.forEach(function (x) { byTier[x.meta.tier].push(x); });
    // Within a tier, the longest-silent partners surface first
    tierOrder.forEach(function (t) {
      byTier[t].sort(function (a, b) { return daysSince(b.p.lastInteraction) - daysSince(a.p.lastInteraction); });
    });

    // Per-flag-type tallies for the summary strip
    var typeCounts = {};
    instances.forEach(function (x) { typeCounts[x.key] = (typeCounts[x.key] || 0) + 1; });

    var summary = tierOrder.map(function (t) {
      return '<div class="sub-stat" style="--sub-stat-accent:var(--' + (t === "medium" ? "warn" : t) + ');">' +
        '<div class="n">' + byTier[t].length + '</div><div class="l">' + TIER_LABEL[t] + ' flags</div></div>';
    }).join("") +
    '<div class="sub-stat"><div class="n">' + PARTNERS.filter(function (p) { return getActiveFlags(p).length > 0; }).length +
      '</div><div class="l">Partners affected</div></div>';

    var groups = tierOrder.map(function (t) {
      if (!byTier[t].length) return "";
      var ts = TIER_STYLE[t];
      var rows = byTier[t].map(function (x) {
        return '<button type="button" class="srow" data-open-profile="' + x.p.id + '">' +
          avatarHtml(x.p.orgName, true) +
          '<span style="min-width:0;"><span class="srow-org">' + escapeHtml(x.p.orgName) + '</span> ' +
          '<span class="tier-label" style="background:' + ts.bg + '; color:' + ts.color + '; border-color:' + ts.border + ';">' + x.meta.label + '</span>' +
          '<div class="flag-desc">' + x.meta.desc(x.p) + '</div></span>' +
          '<span class="srow-right tabular">Last contact<br>' + formatDate(x.p.lastInteraction) + '</span>' +
        '</button>';
      }).join("");
      return '<div class="tier-group"><h3 style="color:' + ts.color + ';">' + TIER_LABEL[t] +
        ' <span class="tally tabular">(' + byTier[t].length + ')</span></h3>' + rows + '</div>';
    }).join("");

    var typeList = Object.keys(typeCounts).sort(function (a, b) { return typeCounts[b] - typeCounts[a]; })
      .map(function (k) { return FLAG_META[k].label + ' (' + typeCounts[k] + ')'; }).join(" · ");

    return subHeadHtml("Open Anomaly Flags", instances.length + " flags across the portfolio") +
      '<div class="sub-summary">' + summary + '</div>' + groups +
      '<p class="sub-note">By type: ' + typeList + '. Flags are recalculated by the system\u2019s code-driven data checks; resolving the underlying gap clears the flag.</p>';
  }

  /* ── Research Stages page: five-column pipeline ───────────────── */
  function renderStagesPage() {
    var cols = STAGE_ORDER.map(function (s) {
      var members = PARTNERS.filter(function (p) { return p.stage === s; })
        .sort(function (a, b) { return a.orgName.localeCompare(b.orgName); });
      var cards = members.length
        ? members.map(function (p) {
            return '<button type="button" class="pipe-card" data-open-profile="' + p.id + '">' +
              avatarHtml(p.orgName, true) +
              '<span style="min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + escapeHtml(p.orgName) + '</span>' +
              '<span class="gene">' + escapeHtml(p.data.disease.gene) + '</span>' +
            '</button>';
          }).join("")
        : '<div class="pipe-empty">No partners at this stage</div>';
      return '<div class="pipe-col" style="--pipe-accent:' + STAGE_STYLE[s].color + ';">' +
        '<h3>' + s + ' <span class="tally">' + members.length + '</span></h3>' + cards +
        '<button type="button" class="btn pipe-filter" data-stage-filter="' + escapeAttr(s) + '">Filter grid \u2192</button>' +
      '</div>';
    }).join("");

    return subHeadHtml("Research Stage Pipeline", PARTNERS.length + " partners, Discovery \u2192 Approved Therapy") +
      '<div class="pipeline">' + cols + '</div>' +
      '<p class="sub-note">Columns reflect each foundation\u2019s current research stage. Stage advances are captured through the profile\u2019s edit mode and flow through every view automatically.</p>';
  }

  /* ── Upcoming Meetings page: month-grouped timeline ───────────── */
  function renderMeetingsPage() {
    var upcoming = PARTNERS.filter(function (p) {
      return p.data.meeting.next && parseLocalDate(p.data.meeting.next) >= REFERENCE_DATE;
    }).sort(function (a, b) { return parseLocalDate(a.data.meeting.next) - parseLocalDate(b.data.meeting.next); });

    var rowsHtml = "", lastMonthKey = "";
    upcoming.forEach(function (p) {
      var d = parseLocalDate(p.data.meeting.next);
      var monthKey = d.getFullYear() + "-" + d.getMonth();
      if (monthKey !== lastMonthKey) {
        rowsHtml += '<div class="month-label">' + MONTHS_FULL[d.getMonth()] + ' ' + d.getFullYear() + '</div>';
        lastMonthKey = monthKey;
      }
      var inDays = Math.round((d - REFERENCE_DATE) / 86400000);
      rowsHtml +=
        '<button type="button" class="srow" data-open-profile="' + p.id + '">' +
          '<span class="datebox"><span class="d tabular">' + d.getDate() + '</span><br><span class="m">' + MONTHS_ABBR[d.getMonth()] + '</span></span>' +
          '<span style="min-width:0;"><span class="srow-org">' + escapeHtml(p.orgName) + '</span>' +
          '<div class="srow-sub">' + (p.followUpOpen ? '<span class="followup-dot" title="Open follow-up"></span>' : '') +
            escapeHtml(p.data.meeting.cadence) + ' cadence · ' + escapeHtml(p.disease) + '</div></span>' +
          '<span class="srow-right tabular">' + (inDays === 0 ? "Today" : "in " + inDays + " day" + (inDays === 1 ? "" : "s")) + '</span>' +
        '</button>';
    });

    // Partners with no confirmed next meeting need scheduling attention
    var unscheduled = PARTNERS.filter(function (p) {
      return !(p.data.meeting.next && parseLocalDate(p.data.meeting.next) >= REFERENCE_DATE);
    }).sort(function (a, b) { return daysSince(b.lastInteraction) - daysSince(a.lastInteraction); });

    var unschedHtml = unscheduled.map(function (p) {
      return srowHtml(p,
        'Silent ' + daysSince(p.lastInteraction) + ' days',
        escapeHtml(p.data.meeting.cadence) + ' · last met ' + (formatDate(p.data.meeting.last) || "never"));
    }).join("");

    var summary =
      '<div class="sub-stat"><div class="n tabular">' + upcoming.length + '</div><div class="l">Meetings scheduled</div></div>' +
      '<div class="sub-stat" style="--sub-stat-accent:var(--warn);"><div class="n tabular">' +
        upcoming.filter(function (p) { return p.followUpOpen; }).length + '</div><div class="l">With open follow-ups</div></div>' +
      '<div class="sub-stat" style="--sub-stat-accent:var(--critical);"><div class="n tabular">' + unscheduled.length + '</div><div class="l">Need scheduling</div></div>';

    return subHeadHtml("Upcoming Meetings", "next meeting confirmed for " + upcoming.length + " of " + PARTNERS.length + " partners") +
      '<div class="sub-summary">' + summary + '</div>' + rowsHtml +
      (unscheduled.length
        ? '<div class="sub-section-label">Needs scheduling (' + unscheduled.length + ')</div>' + unschedHtml
        : '') +
      '<p class="sub-note"><span class="followup-dot"></span>= open follow-up attached. Dates are calculated relative to the REFERENCE_DATE constant defined at the top of this script.</p>';
  }

  /* ── Open Follow-Ups page: action-item level, triaged by urgency ── */
  function getFollowupItems() {
    var items = [];
    PARTNERS.filter(function (p) { return p.followUpOpen; }).forEach(function (p) {
      var openLine = null;
      if (Array.isArray(p.data.meeting.lastSummary)) {
        var found = p.data.meeting.lastSummary.filter(function (s) { return /^Open:/i.test(s); });
        if (found.length) openLine = found[0].replace(/^Open:\s*/i, "");
      }
      if (!openLine) openLine = p.topNeed + " \u2014 awaiting RTWF follow-up.";
      var key = p.id + ":0";
      if (!FOLLOWUP_RESOLVED_SET[key]) {
        var days = daysSince(p.data.meeting.last);
        var status = days > 14 ? "overdue" : days > 7 ? "due-soon" : "on-track";
        items.push({ partner: p, text: openLine, key: key, days: days, status: status });
      }
    });
    return items;
  }

  function fuStatusBadge(status, days) {
    var labels = { "overdue": "Overdue", "due-soon": "Due Soon", "on-track": "On Track" };
    return '<span class="fu-badge fu-badge--' + status + '">' + labels[status] + ' \u00b7 ' + days + 'd</span>';
  }

  function renderFollowupsPage() {
    var items = getFollowupItems();

    /* Sort: Overdue first, Due Soon second, On Track last; within group longest-waiting first */
    var ORDER = ["overdue", "due-soon", "on-track"];
    items.sort(function (a, b) {
      var oi = ORDER.indexOf(a.status) - ORDER.indexOf(b.status);
      return oi !== 0 ? oi : b.days - a.days;
    });

    var overdueCount  = items.filter(function (x) { return x.status === "overdue"; }).length;
    var dueSoonCount  = items.filter(function (x) { return x.status === "due-soon"; }).length;
    var onTrackCount  = items.filter(function (x) { return x.status === "on-track"; }).length;

    var summary =
      '<div class="sub-stat"><div class="n tabular">' + items.length + '</div><div class="l">Open follow-ups</div></div>' +
      '<div class="sub-stat" style="--sub-stat-accent:var(--critical);"><div class="n tabular">' + overdueCount + '</div><div class="l">Overdue (&gt;14 days)</div></div>' +
      '<div class="sub-stat" style="--sub-stat-accent:var(--warn);"><div class="n tabular">' + dueSoonCount + '</div><div class="l">Due soon (7\u201314d)</div></div>' +
      '<div class="sub-stat" style="--sub-stat-accent:var(--good);"><div class="n tabular">' + onTrackCount + '</div><div class="l">On track (\u22647d)</div></div>';

    if (items.length === 0) {
      return subHeadHtml("Open Follow-Ups", "all clear") +
        '<div class="sub-summary">' + summary + '</div>' +
        '<p class="sub-note">\u2713 All open follow-up items have been resolved this session.</p>';
    }

    var rows = items.map(function (item, i) {
      var p = item.partner;
      var savedOwner = FOLLOWUP_OWNERS[item.key] || "";
      var ownerOptions = ['<option value=""' + (savedOwner ? '' : ' selected') + ' disabled>Assign owner\u2026</option>'];
      OWNER_OPTIONS.forEach(function (name) {
        ownerOptions.push('<option value="' + escapeAttr(name) + '"' + (savedOwner === name ? ' selected' : '') + '>' + escapeHtml(name) + '</option>');
      });
      return '<div class="fu-row" style="animation-delay:' + (prefersReduced ? 0 : Math.min(i, 12) * 0.04) + 's;">' +
        '<div class="fu-row-top">' +
          fuStatusBadge(item.status, item.days) +
          '<button type="button" class="fu-row-org" data-open-profile="' + escapeAttr(p.id) + '">' + escapeHtml(p.orgName) + '</button>' +
          '<span class="fu-item-text">' + escapeHtml(item.text) + '</span>' +
        '</div>' +
        '<div class="fu-row-bottom">' +
          '<select class="fu-owner-select" data-fu-key="' + escapeAttr(item.key) + '" aria-label="Assign owner for this follow-up">' + ownerOptions.join("") + '</select>' +
          '<span class="fu-avatar-slot" data-fu-avatar>' + (savedOwner ? avatarHtml(savedOwner, true) : '') + '</span>' +
          '<button type="button" class="btn" style="margin-left:auto;" data-fu-resolve="' + escapeAttr(item.key) + '">\u2713 Mark Resolved</button>' +
        '</div>' +
      '</div>';
    }).join("");

    return subHeadHtml("Open Follow-Ups", items.length + " action item" + (items.length === 1 ? "" : "s") + " awaiting RTWF action") +
      '<div class="sub-summary">' + summary + '</div>' + rows +
      '<p class="sub-note">Sorted by urgency. Overdue = &gt;14 days since last meeting. Resolutions clear the item for this session only.</p>';
  }

  var SUBPAGE_RENDERERS = {
    flags: renderFlagsPage,
    stages: renderStagesPage,
    meetings: renderMeetingsPage,
    followups: renderFollowupsPage
  };

  function renderSubPage() {
    if (currentView === "dashboard") return;
    var fn = SUBPAGE_RENDERERS[currentView];
    if (fn) byId("subPage").innerHTML = fn();
  }

  function showView(view) {
    currentView = view;
    var onDash = view === "dashboard";
    byId("dashboardView").style.display = onDash ? "" : "none";
    byId("subPage").style.display = onDash ? "none" : "";
    if (!onDash) renderSubPage();
    window.scrollTo(0, 0);
  }

  /* =====================================================
     MODAL & OVERLAY HELPERS
  ===================================================== */

  /* — Demo modal (Upgrade 1) — */
  function openDemoModal(title, msg) {
    byId("demoModalTitle").textContent = title || "Feature Coming Soon";
    byId("demoModalMsg").textContent = msg || "This feature will be connected to the live system when the backend integration is complete.";
    var el = byId("demoModal");
    el.classList.add("open");
    el.removeAttribute("aria-hidden");
    document.body.classList.add("modal-open");
    setTimeout(function () { var btn = byId("demoModalClose"); if (btn) btn.focus(); }, 50);
  }
  function closeDemoModal() {
    var el = byId("demoModal");
    el.classList.remove("open");
    el.setAttribute("aria-hidden", "true");
    if (!state.paletteOpen && !state.activePartnerId && !byId("prepOverlay").classList.contains("open")) {
      document.body.classList.remove("modal-open");
    }
  }

  /* — Resolve flag modal (Upgrade 3) — */
  function openResolveModal(partnerId, flagKey) {
    _resolveTarget = { partnerId: partnerId, flagKey: flagKey };
    var meta = FLAG_META[flagKey];
    byId("resolveModalTitle").textContent = "Resolve: " + (meta ? meta.label : flagKey);
    byId("resolveNoteInput").value = "";
    var el = byId("resolveModal");
    el.classList.add("open");
    el.removeAttribute("aria-hidden");
    document.body.classList.add("modal-open");
    setTimeout(function () { var inp = byId("resolveNoteInput"); if (inp) inp.focus(); }, 50);
  }
  function closeResolveModal() {
    var el = byId("resolveModal");
    el.classList.remove("open");
    el.setAttribute("aria-hidden", "true");
    _resolveTarget = { partnerId: null, flagKey: null };
    if (!state.paletteOpen && !state.activePartnerId && !byId("prepOverlay").classList.contains("open")) {
      document.body.classList.remove("modal-open");
    }
  }
  function confirmResolveFlag() {
    var note = (byId("resolveNoteInput").value || "").trim();
    if (!note) { byId("resolveNoteInput").focus(); return; }
    var pid = _resolveTarget.partnerId;
    var fkey = _resolveTarget.flagKey;
    if (!pid || !fkey) { closeResolveModal(); return; }
    if (!FLAG_RESOLVED[pid]) FLAG_RESOLVED[pid] = {};
    var today = new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
    FLAG_RESOLVED[pid][fkey] = { note: note, date: today };
    closeResolveModal();
    /* Bump dataVersion: re-renders grid, metrics, slide-over, and subPage */
    state.dataVersion = state.dataVersion + 1;
  }

  /* — Meeting prep overlay (Upgrade 5) — */
  function renderMeetingPrep(p) {
    var d = p.data;
    var active = getActiveFlags(p);
    var accent = stageAccent(p.stage);
    var agendaItems = buildAgendaItems(p);

    /* Flags section — condensed (flag name + one-line description) */
    var flagsHtml;
    if (active.length === 0) {
      flagsHtml = '<p class="prep-clean">\u2713 No active anomaly flags for this partner.</p>';
    } else {
      flagsHtml = active.map(function (f) {
        var meta = FLAG_META[f];
        var ts = TIER_STYLE[meta.tier];
        return '<div class="prep-flag-item">' +
          '<span class="prep-flag-name"><span class="tier-label" style="background:' + ts.bg + '; color:' + ts.color + '; border-color:' + ts.border + ';">' + TIER_LABEL[meta.tier] + '</span> ' + meta.label + '</span>' +
          '<span class="prep-flag-desc">' + escapeHtml(meta.desc(p)) + '</span>' +
        '</div>';
      }).join("");
    }

    /* Full AI agenda */
    var agendaHtml = '<ol class="ac-timeline prep-agenda" style="--dyn:' + accent + ';">' +
      agendaItems.map(function (item, i) {
        return '<li class="ac-item">' +
          '<span class="ac-node tabular" style="border-color:' + accent + '; color:' + accent + ';">' + (i + 1) + '</span>' +
          '<div class="ac-discussion">' + escapeHtml(item.discussion) + '</div>' +
          '<div style="margin-top:var(--sp-2);"><span class="ac-action-label" style="color:' + accent + ';">Action</span> ' +
            '<span class="ac-action-text">' + escapeHtml(item.action) + '</span></div>' +
        '</li>';
      }).join("") + '</ol>';

    /* Last meeting summary */
    var summaryHtml;
    if (Array.isArray(d.meeting.lastSummary) && d.meeting.lastSummary.length) {
      summaryHtml = '<ul class="summary-bullets">' +
        d.meeting.lastSummary.map(function (s) { return '<li>' + escapeHtml(s) + '</li>'; }).join("") + '</ul>';
    } else {
      summaryHtml = '<p style="font-size:var(--fs-sm);color:var(--muted);font-weight:600;">No meeting summary on file.</p>';
    }

    return '<div class="prep-inner">' +
      '<div class="prep-header">' +
        '<div class="prep-title">' +
          '<h2>' + escapeHtml(p.orgName) + '</h2>' +
          '<div class="prep-meta">' + escapeHtml(p.orgType) + ' \u00b7 ' + escapeHtml(p.region) + ' \u00b7 Next meeting: <strong>' + formatDate(p.data.meeting.next) + '</strong></div>' +
        '</div>' +
        '<div class="prep-actions" id="prepActions">' +
          '<button type="button" class="btn" id="prepPrintBtn">\uD83D\uDDA8 Print</button>' +
          '<button type="button" class="btn" id="prepCloseBtn">\u2715 Close</button>' +
        '</div>' +
      '</div>' +
      '<div class="prep-section">' +
        '<div class="prep-section-head">Active Anomaly Flags</div>' + flagsHtml +
      '</div>' +
      '<div class="prep-section">' +
        '<div class="prep-section-head">AI-Drafted Meeting Agenda</div>' + agendaHtml +
      '</div>' +
      '<div class="prep-section">' +
        '<div class="prep-section-head">Last Meeting Summary \u2014 ' + (formatDate(d.meeting.last) || "No date on file") + '</div>' + summaryHtml +
      '</div>' +
    '</div>';
  }

  function openMeetingPrep(p) {
    byId("prepScroll").innerHTML = renderMeetingPrep(p);
    var el = byId("prepOverlay");
    el.classList.add("open");
    el.removeAttribute("aria-hidden");
    document.body.classList.add("modal-open");
    setTimeout(function () { var btn = byId("prepCloseBtn"); if (btn) btn.focus(); }, 60);
  }
  function closeMeetingPrep() {
    byId("prepOverlay").classList.remove("open");
    byId("prepOverlay").setAttribute("aria-hidden", "true");
    if (!state.paletteOpen && !state.activePartnerId) document.body.classList.remove("modal-open");
  }

  /* =====================================================
     EVENT WIRING — one delegated listener per surface
  ===================================================== */
  function wireEvents() {

    /* ── Bento grid: open profile (click / Enter / Space) ── */
    byId("bentoGrid").addEventListener("click", function (e) {
      var clearBtn = e.target.closest("#emptyClearBtn");
      if (clearBtn) { clearAllFilters(); return; }
      var card = e.target.closest(".pcard");
      if (card) openSlideOver(card.getAttribute("data-id"), card);
    });
    byId("bentoGrid").addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        var card = e.target.closest(".pcard");
        if (card) { e.preventDefault(); openSlideOver(card.getAttribute("data-id"), card); }
      }
    });

    /* ── Metric cards: Total clears filters, the rest open offshoot pages ── */
    function activateMetric(target) {
      var m = target.closest("[data-metric]");
      if (!m) return false;
      var kind = m.getAttribute("data-metric");
      if (kind === "all") {
        clearAllFilters();
        byId("bentoGrid").scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
      } else {
        showView(kind);   // "flags" | "stages" | "meetings" | "followups"
      }
      return true;
    }
    byId("metricsPanel").addEventListener("click", function (e) { activateMetric(e.target); });
    byId("metricsPanel").addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        if (activateMetric(e.target)) e.preventDefault();
      }
    });

    /* ── Offshoot pages: back, open profile, pipeline grid filter ── */
    byId("subPage").addEventListener("click", function (e) {
      if (e.target.closest("[data-back]")) { showView("dashboard"); return; }

      /* Follow-up: mark resolved (Upgrade 2) */
      var fuResolveBtn = e.target.closest("[data-fu-resolve]");
      if (fuResolveBtn) {
        FOLLOWUP_RESOLVED_SET[fuResolveBtn.getAttribute("data-fu-resolve")] = true;
        renderSubPage();
        return;
      }

      var sf = e.target.closest("[data-stage-filter]");
      if (sf) {
        state.stage = sf.getAttribute("data-stage-filter");
        showView("dashboard");
        byId("bentoGrid").scrollIntoView({ behavior: prefersReduced ? "auto" : "smooth", block: "start" });
        return;
      }
      var row = e.target.closest("[data-open-profile]");
      if (row) openSlideOver(row.getAttribute("data-open-profile"), row);
    });

    /* ── Filter chips row ── */
    byId("chipsRow").addEventListener("click", function (e) {
      if (e.target.closest("#exportCsvBtn")) { exportCsv(); return; }
      if (e.target.closest("#clearAllChips")) { clearAllFilters(); return; }
      var x = e.target.closest("[data-chip]");
      if (!x) return;
      var key = x.getAttribute("data-chip");
      if (key === "sort") state.sort = "flagged";
      else {
        state[key] = "";
        if (key === "search") byId("paletteInput").value = "";
      }
    });

    /* ── Command palette invocation ── */
    byId("paletteBtn").addEventListener("click", openPalette);
    byId("fab").addEventListener("click", openPalette);

    /* ── Demo modal (Upgrade 1) ── */
    byId("demoModal").addEventListener("click", function (e) {
      if (!e.target.closest(".modal-box")) closeDemoModal();
    });
    byId("demoModalClose").addEventListener("click", closeDemoModal);

    /* ── Resolve flag modal (Upgrade 3) ── */
    byId("resolveModal").addEventListener("click", function (e) {
      if (!e.target.closest(".modal-box")) closeResolveModal();
    });
    byId("resolveCancelBtn").addEventListener("click", closeResolveModal);
    byId("resolveConfirmBtn").addEventListener("click", confirmResolveFlag);
    byId("resolveNoteInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); confirmResolveFlag(); }
    });

    /* ── Meeting prep overlay (Upgrade 5) ── */
    byId("prepOverlay").addEventListener("click", function (e) {
      if (e.target.closest("#prepCloseBtn")) { closeMeetingPrep(); return; }
      if (e.target.closest("#prepPrintBtn")) { window.print(); return; }
    });

    /* ── Follow-up owner assignment (Upgrade 2) ── */
    byId("subPage").addEventListener("change", function (e) {
      var sel = e.target.closest(".fu-owner-select");
      if (sel) {
        FOLLOWUP_OWNERS[sel.getAttribute("data-fu-key")] = sel.value;
        var avatarSlot = sel.parentNode.querySelector("[data-fu-avatar]");
        if (avatarSlot) avatarSlot.innerHTML = sel.value ? avatarHtml(sel.value, true) : "";
      }
    });
    byId("paletteOverlay").addEventListener("click", function (e) {
      if (!e.target.closest(".palette")) closePalette();   // click outside the glass closes
    });

    /* Live search: typing filters the grid behind the palette in real time */
    byId("paletteInput").addEventListener("input", function (e) {
      state.paletteIndex = 0;
      state.search = e.target.value;
    });

    /* Palette body: filter chips, sort, clear, and result rows */
    byId("paletteBody").addEventListener("click", function (e) {
      if (e.target.closest("[data-clear-all]")) { clearAllFilters(); byId("paletteInput").focus(); return; }
      var chip = e.target.closest(".fchip[data-fkey]");
      if (chip) {
        var key = chip.getAttribute("data-fkey");
        var val = chip.getAttribute("data-fval");
        if (key === "sort") state.sort = val;
        else state[key] = (state[key] === val) ? "" : val;   // toggle behaviour
        byId("paletteInput").focus();
        return;
      }
      var row = e.target.closest(".presult[data-open]");
      if (row) {
        var id = row.getAttribute("data-open");
        closePalette();
        openSlideOver(id, byId("bentoGrid").querySelector('.pcard[data-id="' + id + '"]'));
      }
    });

    /* Palette keyboard: ↑↓ move cursor, Enter opens the highlighted partner */
    byId("paletteInput").addEventListener("keydown", function (e) {
      var results = sortPartners(getFilteredPartners()).slice(0, PALETTE_MAX_RESULTS);
      if (e.key === "ArrowDown") {
        e.preventDefault();
        state.paletteIndex = Math.min(state.paletteIndex + 1, Math.max(0, results.length - 1));
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        state.paletteIndex = Math.max(state.paletteIndex - 1, 0);
      } else if (e.key === "Enter" && results.length) {
        e.preventDefault();
        var id = results[Math.min(state.paletteIndex, results.length - 1)].id;
        closePalette();
        openSlideOver(id, byId("bentoGrid").querySelector('.pcard[data-id="' + id + '"]'));
      }
    });

    /* ── Slide-over surface: delegated (content re-renders freely) ── */
    byId("soScrim").addEventListener("click", closeSlideOver);
    byId("soScroll").addEventListener("click", function (e) {
      if (e.target.closest(".demo-link")) {
        e.preventDefault();
        var demoEl = e.target.closest(".demo-link");
        openDemoModal(
          demoEl.getAttribute("data-demo-title"),
          demoEl.getAttribute("data-demo-msg")
        );
        return;
      }
      if (e.target.closest("#soCloseBtn")) { closeSlideOver(); return; }

      /* Meeting prep overlay (Upgrade 5) */
      if (e.target.closest("#meetingPrepBtn")) {
        var prepId = e.target.closest("#meetingPrepBtn").getAttribute("data-prep-id");
        var prepPartner = getPartner(prepId);
        if (prepPartner) openMeetingPrep(prepPartner);
        return;
      }

      /* Resolve flag (Upgrade 3) */
      var resolveBtn = e.target.closest("[data-resolve-partner]");
      if (resolveBtn) {
        openResolveModal(
          resolveBtn.getAttribute("data-resolve-partner"),
          resolveBtn.getAttribute("data-resolve-flag")
        );
        return;
      }
      if (e.target.closest("#editToggleBtn")) { state.editMode = true; return; }
      if (e.target.closest("#cancelEditBtn")) { state.editMode = false; return; }
      if (e.target.closest("#saveEditBtn")) { saveProfileEdits(); return; }

      /* Action item check-off: mark done in the session store, item leaves the list */
      var doneBtn = e.target.closest("[data-ac-done]");
      if (doneBtn) {
        acFor(state.activePartnerId).done[doneBtn.getAttribute("data-ac-done")] = true;
        refreshActionCenter();
        return;
      }
      if (e.target.closest("[data-ac-restore]")) {
        acFor(state.activePartnerId).done = {};
        refreshActionCenter();
        return;
      }
      var copyBtn = e.target.closest("[data-ac-copy]");
      if (copyBtn) { copyAgenda(copyBtn); return; }

      var acToggle = e.target.closest("#acToggle");
      if (acToggle) {
        state.agendaExpanded = !state.agendaExpanded;
        // Toggle in place (no full re-render) so open owner selections survive
        var body = byId("acBody");
        if (state.agendaExpanded) { body.removeAttribute("hidden"); acToggle.setAttribute("aria-expanded", "true"); }
        else { body.setAttribute("hidden", ""); acToggle.setAttribute("aria-expanded", "false"); }
      }
    });

    /* Owner assignment → session store + initials avatar beside the task */
    byId("soScroll").addEventListener("change", function (e) {
      var sel = e.target.closest(".owner-select");
      if (sel) {
        var idx = sel.getAttribute("data-ac-owner");
        if (idx !== null) acFor(state.activePartnerId).owners[idx] = sel.value;
        var slot = sel.closest(".ac-owner").querySelector("[data-avatar-slot]");
        slot.innerHTML = sel.value ? avatarHtml(sel.value, true) : "";
        slot.title = sel.value ? "Owner: " + sel.value : "";
        return;
      }
      /* Nonprofit Active checkbox drives the status text field */
      var np = e.target.closest(".np-active-toggle");
      if (np) {
        var txt = np.closest(".np-edit-row").querySelector(".np-status-text");
        txt.value = np.checked ? "501(c)(3) \u2014 Active" : "501(c)(3) \u2014 Application Pending";
      }
    });

    /* ── Global keyboard shortcuts ── */
    document.addEventListener("keydown", function (e) {
      var isModK = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k";
      var typing = /^(input|textarea|select)$/i.test((e.target.tagName || ""));
      if (isModK) {
        e.preventDefault();
        state.paletteOpen ? closePalette() : openPalette();
        return;
      }
      if (e.key === "/" && !typing && !state.paletteOpen) {
        e.preventDefault();
        openPalette();
        return;
      }
      if (e.key === "Escape") {
        if (byId("resolveModal").classList.contains("open")) { closeResolveModal(); return; }
        if (byId("demoModal").classList.contains("open")) { closeDemoModal(); return; }
        if (byId("prepOverlay").classList.contains("open")) { closeMeetingPrep(); return; }
        if (state.paletteOpen) closePalette();
        else if (state.activePartnerId && state.editMode) state.editMode = false;  // step out of edit first
        else if (state.activePartnerId) closeSlideOver();
        else if (currentView !== "dashboard") showView("dashboard");
      }
    });
  }

  /* =====================================================
     AMBIENT CHROME — theme, clock, ripple, scroll progress
  ===================================================== */
  function wireChrome() {
    /* Theme toggle (persists only for the session; dynamic stage accents
       are re-derived so the slide-over tint matches the new theme) */
    var themeBtn = byId("themeToggle");
    function setTheme(mode) {
      if (mode === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        themeBtn.textContent = "\u2600";
        themeBtn.setAttribute("aria-label", "Switch to light mode");
        themeBtn.title = "Switch to light mode";
      } else {
        document.documentElement.removeAttribute("data-theme");
        themeBtn.textContent = "\u263E";
        themeBtn.setAttribute("aria-label", "Switch to dark mode");
        themeBtn.title = "Switch to dark mode";
      }
      if (state.activePartnerId) renderSlideOver();
    }
    setTheme(window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    themeBtn.addEventListener("click", function () {
      setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    /* Platform-aware shortcut hints (⌘K on Mac, Ctrl K elsewhere) */
    var isMac = /Mac|iPhone|iPad/.test(navigator.platform || "");
    if (!isMac) {
      document.querySelectorAll("#paletteKbdHint, .fab kbd").forEach(function (el) { el.textContent = "Ctrl K"; });
    }

    /* Live clock — Eastern Time, hours:minutes only, EST/EDT label
       resolves automatically via the time zone name */
    var timeEl = byId("clockTime"), dateEl = byId("clockDate");
    function tickClock() {
      var now = new Date();
      timeEl.textContent = now.toLocaleTimeString("en-US", {
        hour: "numeric", minute: "2-digit",
        timeZone: "America/New_York", timeZoneName: "short"
      });
      dateEl.textContent = now.toLocaleDateString("en-US", {
        weekday: "short", month: "short", day: "numeric", year: "numeric",
        timeZone: "America/New_York"
      });
    }
    tickClock();
    setInterval(tickClock, 30000);

    /* Pointer ripple on tactile controls */
    document.addEventListener("pointerdown", function (e) {
      if (prefersReduced) return;
      var btn = e.target.closest("button, .hbtn, .pcard, .onepager-link");
      if (!btn) return;
      var cs = window.getComputedStyle(btn);
      if (cs.position === "static") btn.style.position = "relative";
      if (cs.overflow !== "hidden") btn.style.overflow = "hidden";
      var rect = btn.getBoundingClientRect();
      var size = Math.max(rect.width, rect.height);
      var ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
      ripple.style.top = (e.clientY - rect.top - size / 2) + "px";
      btn.appendChild(ripple);
      setTimeout(function () { ripple.remove(); }, 600);
    });

    /* Scroll progress hairline */
    var progress = byId("scrollProgress");
    function updateProgress() {
      var doc = document.documentElement;
      var max = doc.scrollHeight - doc.clientHeight;
      progress.style.width = (max > 0 ? (doc.scrollTop / max) * 100 : 0) + "%";
    }
    window.addEventListener("scroll", updateProgress, { passive: true });
    window.addEventListener("resize", updateProgress);
    updateProgress();
  }

  /* =====================================================
     SUBSCRIPTIONS — the reactive wiring
     Each component declares which state keys it cares
     about; the store re-runs only what's affected.
  ===================================================== */
  store.subscribe(FILTER_KEYS.concat(["dataVersion"]), renderGrid);
  store.subscribe(FILTER_KEYS.concat(["dataVersion"]), renderChips);
  store.subscribe(FILTER_KEYS.concat(["paletteIndex"]), renderPalette);
  store.subscribe(["dataVersion"], renderMetrics);
  store.subscribe(["dataVersion"], renderSubPage);   // saved edits flow into open offshoot pages
  store.subscribe(["activePartnerId", "editMode", "dataVersion"], function () {
    if (state.activePartnerId) renderSlideOver();
  });

  /* =====================================================
     INIT
  ===================================================== */
  function init() {
    renderMetrics();
    renderChips();
    renderGrid();
    wireEvents();
    wireChrome();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
