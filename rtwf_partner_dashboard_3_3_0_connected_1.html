<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTWF Partner Relationship Dashboard · 3.3.0</title>
<style>
/* ══════════════════════════════════════════════════════════════════
   RTWF PARTNER RM · 3.0 — DESIGN TOKEN SYSTEM
   ──────────────────────────────────────────────────────────────────
   Architecture: semantic CSS custom properties at :root, consumed
   everywhere. NOTE: the tokens --stage-1..5, --critical/-bg/-border,
   --warn*, --info*, --good* are load-bearing — the preserved data
   layer (STAGE_STYLE / TIER_STYLE) references them by name.
   Do not rename them.
══════════════════════════════════════════════════════════════════ */
:root {
  /* ── Brand & surface palette (RTWF deep blue identity) ───────── */
  --bg:            #f2f5fa;
  --bg-deep:       #e9eef6;
  --glass:         rgba(247, 249, 253, 0.72);
  --glass-strong:  rgba(255, 255, 255, 0.82);
  --scrim:         rgba(13, 26, 46, 0.42);
  --ink:           #162032;
  --ink-soft:      #45526b;
  --muted:         #7b869c;
  --faint:         #a6b0c3;
  --accent:        #185fa5;
  --accent-2:      #1e88c9;
  --accent-glow:   rgba(24, 95, 165, 0.30);
  --accent-soft:   #e6effa;
  --accent-dark:   #0d3d6b;
  --border:        #dbe2ef;
  --border-strong: #c6d0e2;
  --card:          #ffffff;
  --card-hover:    #f8fafd;

  /* ── Semantic status tokens (referenced by JS — keep names) ──── */
  --warn:            #9c5a16;
  --warn-bg:         #fbf0e2;
  --warn-border:     #e9c89a;
  --good:            #2e7042;
  --good-bg:         #eaf4ec;
  --good-border:     #c5ddc9;
  --critical:        #b03a2b;
  --critical-bg:     #fbe5e0;
  --critical-border: #eba896;
  --info:            #2f6690;
  --info-bg:         #e7f0f7;
  --info-border:     #bcd3e3;

  /* ── Research-stage scale (referenced by JS — keep names) ────── */
  --stage-1: #d7e5f2;
  --stage-2: #a9cae2;
  --stage-3: #659dc7;
  --stage-4: #185fa5;
  --stage-5: #0d3d6b;

  /* ── Dynamic accent: re-tinted per selected partner stage/tier ─ */
  --dyn:      var(--accent);
  --dyn-soft: var(--accent-soft);

  /* ── Stage-badge ink (flips in dark theme — see below) ───────── */
  --badge-on-dim:    #16324c;   /* ink on pale stage fills  */
  --badge-on-bright: #f2f7fc;   /* ink on deep stage fills  */

  /* ── Spacing scale (4pt base) ────────────────────────────────── */
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-7: 32px; --sp-8: 44px;

  /* ── Fluid typography scale (clamp: min / preferred / max) ───── */
  --fs-xs:   clamp(10.5px, 0.62vw + 9px,   11.5px);
  --fs-sm:   clamp(12px,   0.70vw + 10px,  13px);
  --fs-base: clamp(13.5px, 0.80vw + 11px,  14.5px);
  --fs-md:   clamp(15px,   0.95vw + 12px,  16.5px);
  --fs-lg:   clamp(18px,   1.30vw + 13px,  21px);
  --fs-xl:   clamp(22px,   2.00vw + 14px,  28px);
  --fs-hero: clamp(26px,   2.60vw + 16px,  36px);

  /* ── Radii ───────────────────────────────────────────────────── */
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;

  /* ── Easing curves (spring-flavoured cubic-beziers) ──────────── */
  --ease-spring: cubic-bezier(0.34, 1.36, 0.44, 1);   /* playful overshoot */
  --ease-glide:  cubic-bezier(0.22, 1, 0.36, 1);      /* expo-out glide    */
  --ease-swift:  cubic-bezier(0.55, 0, 0.1, 1);       /* swift in-out      */

  /* ── Layered elevation (multi-stop, tactile depth) ───────────── */
  --el-1: 0 1px 2px rgba(17,32,58,0.06), 0 1px 0 rgba(17,32,58,0.03);
  --el-2: 0 2px 4px rgba(17,32,58,0.05), 0 8px 24px rgba(17,32,58,0.08);
  --el-3: 0 4px 10px rgba(17,32,58,0.07), 0 18px 46px rgba(13,61,107,0.14);
  --el-4: 0 8px 18px rgba(13,61,107,0.12), 0 32px 80px rgba(13,61,107,0.22);
  --ring: 0 0 0 1px var(--border);
}

[data-theme="dark"] {
  /* Reworked dark palette: one navy surface ramp (bg → card → hover),
     borders two steps above card, and tier colors built as matched
     triads (text ≥ 4.5:1 on bg, border midway) so flags read the same
     in both themes. */
  --bg:            #0e1524;
  --bg-deep:       #090f1a;
  --glass:         rgba(16, 24, 40, 0.72);
  --glass-strong:  rgba(21, 30, 48, 0.86);
  --scrim:         rgba(3, 7, 15, 0.62);
  --ink:           #e9eef7;
  --ink-soft:      #b7c2d6;
  --muted:         #8391a9;
  --faint:         #5b6880;
  --accent:        #66a9ea;
  --accent-2:      #4b97dd;
  --accent-glow:   rgba(102, 169, 234, 0.32);
  --accent-soft:   #182a44;
  --accent-dark:   #a9cdf2;
  --border:        #263450;
  --border-strong: #35466a;
  --card:          #151e30;
  --card-hover:    #1b2640;

  --warn:            #ecb069; --warn-bg: #2e2310; --warn-border: #64491f;
  --good:            #86cf9a; --good-bg: #142a1c; --good-border: #2f5138;
  --critical:        #f0917d; --critical-bg: #351a12; --critical-border: #6b3324;
  --info:            #85bbe4; --info-bg: #16283e; --info-border: #2f4c6f;

  --stage-1: #223349; --stage-2: #2e4b6d; --stage-3: #356390;
  --stage-4: #5ea6ec; --stage-5: #93c6f5;

  /* Stage-badge ink flips with the theme: "dark-text" stages have dark
     navy fills in dark mode (need light ink) and vice versa. */
  --badge-on-dim:    #dbe7f5;
  --badge-on-bright: #0c1626;

  --el-1: 0 1px 2px rgba(0,0,0,0.4);
  --el-2: 0 2px 4px rgba(0,0,0,0.35), 0 8px 24px rgba(0,0,0,0.45);
  --el-3: 0 4px 10px rgba(0,0,0,0.4), 0 18px 46px rgba(0,0,0,0.55);
  --el-4: 0 8px 18px rgba(0,0,0,0.5), 0 32px 90px rgba(0,0,0,0.65);
}

/* ══════════════════════════════════════════════════════════════════
   BASE
══════════════════════════════════════════════════════════════════ */
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
html, body {
  margin: 0; padding: 0;
  background:
    radial-gradient(1100px 520px at 85% -10%, var(--accent-soft), transparent 60%),
    radial-gradient(900px 480px at -10% 110%, var(--accent-soft), transparent 55%),
    var(--bg);
  color: var(--ink);
  font-family: "Avenir Next", "Segoe UI Variable Display", "Segoe UI",
    -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
  font-size: var(--fs-base);
  -webkit-font-smoothing: antialiased;
  transition: background 0.45s ease, color 0.45s ease;
}
button, select, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
/* Numeric data reads with tabular figures everywhere */
.tabular { font-variant-numeric: tabular-nums; }

/* Locks background scroll while the palette or slide-over is open */
body.modal-open { overflow: hidden; }

/* ── Scroll progress hairline ───────────────────────────────────── */
#scrollProgress {
  position: fixed; top: 0; left: 0; height: 2px; width: 0;
  background: linear-gradient(90deg, var(--accent-2), var(--accent));
  z-index: 300; pointer-events: none;
  transition: width 0.1s linear;
}

/* ══════════════════════════════════════════════════════════════════
   OFFSHOOT PAGES — mini dashboards per metric
══════════════════════════════════════════════════════════════════ */
.subpage { animation: cardIn 0.4s var(--ease-glide) both; }
.sub-head { display: flex; align-items: center; gap: var(--sp-4); margin-bottom: var(--sp-5); flex-wrap: wrap; }
.sub-head h2 { margin: 0; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.02em; }
.sub-head .sub-count { font-size: var(--fs-sm); color: var(--muted); font-weight: 700; }
.sub-head .btn { margin-right: var(--sp-2); }

/* Summary strip: small stat blocks at the top of every offshoot page */
.sub-summary { display: flex; gap: var(--sp-4); flex-wrap: wrap; margin-bottom: var(--sp-5); }
.sub-stat {
  flex: 1 1 150px; background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-md); padding: var(--sp-4); box-shadow: var(--el-1);
  border-top: 3px solid var(--sub-stat-accent, var(--accent));
}
.sub-stat .n { font-size: var(--fs-lg); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
.sub-stat .l { font-size: var(--fs-xs); font-weight: 700; color: var(--muted); margin-top: 5px; }

/* Generic clickable partner row on offshoot pages */
.srow {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: var(--sp-3) var(--sp-4); margin-bottom: var(--sp-2); cursor: pointer;
  box-shadow: var(--el-1); font-size: var(--fs-sm);
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-glide), border-color 0.15s ease;
}
.srow:hover { transform: translateX(3px); box-shadow: var(--el-2); border-color: var(--border-strong); }
.srow .srow-org { font-weight: 800; }
.srow .srow-sub { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-top: 1px; }
.srow .srow-right { margin-left: auto; text-align: right; flex: none; font-size: var(--fs-xs); font-weight: 700; color: var(--muted); }

/* Flags page: tier group headers + flag detail rows */
.tier-group { margin-bottom: var(--sp-6); }
.tier-group h3 {
  margin: 0 0 var(--sp-3); font-size: var(--fs-sm); font-weight: 800;
  letter-spacing: 0.06em; text-transform: uppercase;
  display: flex; align-items: center; gap: var(--sp-2);
}
.tier-group h3 .tally { color: var(--muted); font-weight: 700; text-transform: none; letter-spacing: 0; }
.flag-desc { font-size: var(--fs-xs); color: var(--ink-soft); font-weight: 500; line-height: 1.45; margin-top: 3px; }

/* Stages page: horizontal pipeline of stage columns */
.pipeline { display: grid; grid-template-columns: repeat(5, 1fr); gap: var(--sp-4); }
@media (max-width: 1100px) { .pipeline { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px) { .pipeline { grid-template-columns: 1fr; } }
.pipe-col {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: var(--sp-4); box-shadow: var(--el-1); display: flex; flex-direction: column; gap: var(--sp-2);
  border-top: 4px solid var(--pipe-accent, var(--accent));
}
.pipe-col h3 { margin: 0 0 var(--sp-1); font-size: var(--fs-sm); font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
.pipe-col h3 .tally { color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.pipe-card {
  display: flex; align-items: center; gap: var(--sp-2); width: 100%; text-align: left;
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3); cursor: pointer; font-size: var(--fs-xs); font-weight: 700;
  transition: transform 0.2s var(--ease-spring), border-color 0.15s ease, background 0.15s ease;
}
.pipe-card:hover { transform: translateY(-1px); border-color: var(--border-strong); background: var(--card-hover); }
.pipe-card .gene { font-size: 10px; font-weight: 800; color: var(--accent-dark); background: var(--accent-soft); border-radius: 5px; padding: 1px 6px; margin-left: auto; flex: none; }
.pipe-col .pipe-filter { margin-top: auto; align-self: flex-start; }
.pipe-empty { font-size: var(--fs-xs); color: var(--faint); font-weight: 600; font-style: italic; padding: var(--sp-2) 0; }

/* Meetings page: month-grouped timeline with date blocks */
.month-label {
  font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); margin: var(--sp-5) 0 var(--sp-3);
}
.month-label:first-of-type { margin-top: 0; }
.datebox {
  flex: none; width: 46px; text-align: center; border-radius: var(--r-sm);
  background: var(--accent-soft); border: 1px solid var(--border); padding: 5px 0;
}
.datebox .d { font-size: var(--fs-md); font-weight: 800; line-height: 1; color: var(--accent-dark); }
.datebox .m { font-size: 9.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.followup-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); margin-right: 5px; }
.sub-section-label { font-size: var(--fs-sm); font-weight: 800; margin: var(--sp-6) 0 var(--sp-3); color: var(--ink); }
.sub-note { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin: var(--sp-4) 0 0; line-height: 1.5; }

/* ══════════════════════════════════════════════════════════════════
   APP SHELL & GLASS HEADER
══════════════════════════════════════════════════════════════════ */
#app { max-width: 1440px; margin: 0 auto; padding: 0 var(--sp-6) var(--sp-8); position: relative; z-index: 1; }

.app-header {
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-5);
  margin: var(--sp-4) calc(-1 * var(--sp-2)) var(--sp-6);
  background: var(--glass);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--el-2);
}
.brand { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.brand-mark {
  width: 38px; height: 38px; flex: none; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent-2), var(--accent-dark));
  color: #fff; display: grid; place-items: center;
  font-weight: 800; font-size: 13px; letter-spacing: 0.5px;
  box-shadow: 0 4px 14px var(--accent-glow);
}
.brand-title { font-size: var(--fs-md); font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
.brand-sub { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.header-spacer { flex: 1; }

.clock { text-align: right; line-height: 1.25; }
.clock-time { font-weight: 800; font-variant-numeric: tabular-nums; font-size: var(--fs-md); }
.clock-date { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }

/* ── Header buttons: shared tactile treatment ───────────────────── */
.hbtn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 9px 14px; border-radius: var(--r-pill);
  border: 1px solid var(--border); background: var(--card);
  color: var(--ink-soft); font-weight: 700; font-size: var(--fs-sm);
  cursor: pointer; text-decoration: none; white-space: nowrap;
  box-shadow: var(--el-1);
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-glide),
              border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.hbtn:hover { transform: translateY(-1px); box-shadow: var(--el-2); border-color: var(--border-strong); color: var(--ink); }
.hbtn:active { transform: translateY(0) scale(0.97); }
.hbtn kbd {
  font-family: inherit; font-size: 10px; font-weight: 800;
  background: var(--accent-soft); color: var(--accent);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px;
}
.hbtn--icon { width: 40px; height: 40px; padding: 0; justify-content: center; font-size: 16px; }

/* ══════════════════════════════════════════════════════════════════
   METRICS — BESPOKE SVG DATA VIZ PANEL
══════════════════════════════════════════════════════════════════ */
.metrics {
  display: grid; gap: var(--sp-4);
  grid-template-columns: repeat(12, 1fr);
  margin-bottom: var(--sp-6);
}
.metric-card {
  grid-column: span 2;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--sp-5);
  box-shadow: var(--el-1); position: relative; overflow: hidden;
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-glide), border-color 0.2s ease;
}
.metric-card:hover { transform: translateY(-2px); box-shadow: var(--el-2); }
/* Clickable metrics: each headline number is a quick view of the grid */
.metric-card--link { cursor: pointer; }
.metric-card--link:hover { border-color: var(--accent); }
.metric-card--link:active { transform: translateY(0) scale(0.99); }
.metric-go {
  position: absolute; top: var(--sp-4); right: var(--sp-4);
  font-size: var(--fs-xs); font-weight: 800; color: var(--accent);
  opacity: 0; transform: translateX(-4px);
  transition: opacity 0.2s ease, transform 0.25s var(--ease-spring);
}
.metric-card--link:hover .metric-go, .metric-card--link:focus-visible .metric-go { opacity: 1; transform: translateX(0); }
.metric-card--donut { grid-column: span 3; display: flex; gap: var(--sp-4); align-items: center; }
.metric-card--flags { grid-column: span 3; }
.metric-label { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: var(--sp-2); }
.metric-value { font-size: var(--fs-hero); font-weight: 800; letter-spacing: -0.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.metric-sub { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-top: var(--sp-2); }

/* Donut: segments draw themselves in via stroke-dashoffset keyframes */
.donut-wrap { flex: none; }
.donut-seg {
  fill: none; stroke-width: 14; stroke-linecap: butt;
  animation: donutDraw 1.1s var(--ease-glide) both;
}
@keyframes donutDraw { from { stroke-dashoffset: 264; } }
.donut-center-num { font-size: 22px; font-weight: 800; fill: var(--ink); }
.donut-center-cap { font-size: 7.5px; font-weight: 700; fill: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.donut-legend { display: grid; gap: 5px; min-width: 0; }
.donut-legend-row { display: flex; align-items: center; gap: 7px; font-size: var(--fs-xs); font-weight: 600; color: var(--ink-soft); }
.donut-legend-row .swatch { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.donut-legend-row .cnt { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--ink); }

/* Segmented anomaly bar: tier blocks grow in with a stagger */
.segbar { display: flex; height: 12px; border-radius: var(--r-pill); overflow: hidden; margin-top: var(--sp-3); background: var(--bg-deep); }
.segbar-chunk { height: 100%; animation: chunkGrow 0.9s var(--ease-glide) both; transform-origin: left; }
@keyframes chunkGrow { from { transform: scaleX(0); } }
.segbar-legend { display: flex; gap: var(--sp-4); margin-top: var(--sp-3); flex-wrap: wrap; }
.segbar-legend span { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-xs); font-weight: 700; color: var(--ink-soft); }
.segbar-legend i { width: 9px; height: 9px; border-radius: 3px; font-style: normal; }

/* ══════════════════════════════════════════════════════════════════
   ACTIVE FILTER CHIPS  (visible state readout for the ⌘K palette)
══════════════════════════════════════════════════════════════════ */
.chips-row { display: flex; align-items: center; gap: var(--sp-2); flex-wrap: wrap; margin-bottom: var(--sp-4); min-height: 34px; }
.grid-meta { font-size: var(--fs-sm); color: var(--muted); font-weight: 600; margin-right: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 8px 5px 12px; border-radius: var(--r-pill);
  background: var(--accent-soft); color: var(--accent-dark);
  border: 1px solid var(--border); font-size: var(--fs-xs); font-weight: 700;
  animation: chipIn 0.3s var(--ease-spring) both;
}
@keyframes chipIn { from { opacity: 0; transform: scale(0.85); } }
.chip b { font-weight: 800; }
.chip button {
  border: 0; background: transparent; color: inherit; cursor: pointer;
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 800; padding: 0;
  transition: background 0.15s ease, transform 0.2s var(--ease-spring);
}
.chip button:hover { background: rgba(0,0,0,0.08); transform: scale(1.15); }
.chip--clear { background: transparent; color: var(--muted); cursor: pointer; border-style: dashed; }
.chip--clear:hover { color: var(--critical); border-color: var(--critical-border); }

/* ══════════════════════════════════════════════════════════════════
   BENTO GRID — partner cards
══════════════════════════════════════════════════════════════════ */
.bento {
  display: grid; gap: var(--sp-4);
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  grid-auto-rows: 1fr;   /* every card in a row shares the tallest height */
}
.pcard {
  position: relative; display: flex; flex-direction: column; gap: var(--sp-3);
  min-height: 218px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-lg); padding: var(--sp-5);
  box-shadow: var(--el-1); cursor: pointer; text-align: left;
  animation: cardIn 0.45s var(--ease-glide) both;
  transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-glide), border-color 0.2s ease;
  will-change: transform;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
.pcard:hover { transform: translateY(-3px); box-shadow: var(--el-3); border-color: var(--border-strong); }
.pcard:active { transform: translateY(-1px) scale(0.99); }
/* Accent seam along the top, tinted by the card's research stage */
.pcard::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
  background: var(--card-accent, var(--accent));
  border-radius: var(--r-lg) var(--r-lg) 0 0; opacity: 0.9;
}

.pcard-top { display: flex; align-items: flex-start; gap: var(--sp-3); }
.avatar {
  flex: none; width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; color: #fff;
  font-weight: 800; font-size: 13px; letter-spacing: 0.4px;
  box-shadow: inset 0 -8px 14px rgba(0,0,0,0.18);
}
.avatar--sm { width: 26px; height: 26px; border-radius: 8px; font-size: 10px; }
.pcard-org {
  font-size: var(--fs-md); font-weight: 800; letter-spacing: -0.01em; line-height: 1.25;
  /* Uniformity: names never exceed two lines */
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.pcard-meta {
  font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* Pulsating anomaly beacon (critical tier pulses harder) */
.beacon { position: relative; margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-xs); font-weight: 800; }
.beacon-dot { width: 9px; height: 9px; border-radius: 50%; position: relative; }
.beacon-dot::after {
  content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 2px solid currentColor; opacity: 0;
  animation: beaconPulse 2s var(--ease-glide) infinite;
}
.beacon--critical .beacon-dot::after { animation-duration: 1.15s; }
@keyframes beaconPulse {
  0% { transform: scale(0.4); opacity: 0.8; }
  70%, 100% { transform: scale(1.5); opacity: 0; }
}

.pcard-disease {
  font-size: var(--fs-sm); color: var(--ink-soft); font-weight: 600; line-height: 1.4;
  /* Reserve exactly two lines so the stage bar sits at the same y on every card */
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: calc(2 * 1.4em);
}
.pcard-disease .gene {
  font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em;
  background: var(--accent-soft); color: var(--accent-dark);
  border-radius: 6px; padding: 2px 7px; margin-left: 6px; white-space: nowrap;
}

/* SVG stage journey bar (Discovery → Approved Therapy) */
.stagebar { margin-top: auto; }
.stagebar-caption { display: flex; justify-content: space-between; font-size: var(--fs-xs); color: var(--muted); font-weight: 700; margin-bottom: 5px; }
.stagebar-caption .cur { color: var(--ink); }
.stagebar svg { display: block; width: 100%; height: 8px; }
.stagebar .seg-on { animation: segFill 0.7s var(--ease-glide) both; transform-origin: left; }
@keyframes segFill { from { transform: scaleX(0); } }

.pcard-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.pcard-foot .need {
  background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-border);
  border-radius: var(--r-pill); padding: 3px 10px; font-weight: 700;
  max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.empty-state {
  grid-column: 1 / -1; text-align: center; padding: var(--sp-8);
  border: 1.5px dashed var(--border-strong); border-radius: var(--r-lg);
  color: var(--muted); font-weight: 600;
}
.empty-state button { margin-top: var(--sp-3); }

/* ══════════════════════════════════════════════════════════════════
   COMMAND PALETTE  (⌘K) — frosted glass modal
══════════════════════════════════════════════════════════════════ */
.palette-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: grid; place-items: start center; padding: 12vh var(--sp-4) var(--sp-4);
  opacity: 0; pointer-events: none; transition: opacity 0.25s var(--ease-glide);
}
.palette-overlay.open { opacity: 1; pointer-events: auto; }
.palette {
  width: min(680px, 100%); max-height: 76vh; display: flex; flex-direction: column;
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(24px) saturate(1.5); backdrop-filter: blur(24px) saturate(1.5);
  border: 1px solid var(--border); border-radius: var(--r-xl);
  box-shadow: var(--el-4); overflow: hidden;
  transform: translateY(-14px) scale(0.98);
  transition: transform 0.3s var(--ease-spring);
}
.palette-overlay.open .palette { transform: translateY(0) scale(1); }
.palette-input-row { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--border); }
.palette-input-row .glyph { color: var(--muted); font-size: 15px; }
#paletteInput {
  flex: 1; border: 0; background: transparent; outline: none;
  font-size: var(--fs-md); font-weight: 600; color: var(--ink);
}
#paletteInput::placeholder { color: var(--faint); }
.palette-esc { font-size: 10px; font-weight: 800; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; }
.palette-body { overflow-y: auto; padding: var(--sp-4) var(--sp-5) var(--sp-5); }
.palette-section-label { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: var(--sp-4) 0 var(--sp-2); }
.palette-section-label:first-child { margin-top: 0; }
.fchips { display: flex; flex-wrap: wrap; gap: 7px; }
.fchip {
  border: 1px solid var(--border); background: var(--card); color: var(--ink-soft);
  border-radius: var(--r-pill); padding: 6px 13px; cursor: pointer;
  font-size: var(--fs-xs); font-weight: 700;
  transition: transform 0.2s var(--ease-spring), background 0.15s ease, color 0.15s ease, border-color 0.15s ease, box-shadow 0.2s ease;
}
.fchip:hover { transform: translateY(-1px); border-color: var(--border-strong); box-shadow: var(--el-1); }
.fchip:active { transform: scale(0.95); }
.fchip.on { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 3px 12px var(--accent-glow); }
.presult {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; text-align: left;
  border: 0; background: transparent; border-radius: var(--r-md);
  padding: 9px var(--sp-3); cursor: pointer;
  transition: background 0.12s ease;
}
.presult:hover, .presult.active { background: var(--accent-soft); }
.presult .p-org { font-weight: 800; font-size: var(--fs-sm); }
.presult .p-sub { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; }
.presult .p-stage { margin-left: auto; flex: none; }
.presult-empty { color: var(--muted); font-size: var(--fs-sm); font-weight: 600; padding: var(--sp-3); }

/* Floating action button — palette invoker for touch users */
.fab {
  position: fixed; right: var(--sp-6); bottom: var(--sp-6); z-index: 150;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 13px 18px; border-radius: var(--r-pill); border: 1px solid var(--border);
  background: var(--glass-strong);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  color: var(--ink); font-weight: 800; font-size: var(--fs-sm); cursor: pointer;
  box-shadow: var(--el-3);
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-glide);
}
.fab:hover { transform: translateY(-2px) scale(1.03); box-shadow: var(--el-4); }
.fab:active { transform: scale(0.96); }
.fab kbd { font-family: inherit; font-size: 10px; font-weight: 800; background: var(--accent); color: #fff; border-radius: 5px; padding: 2px 7px; }

/* ══════════════════════════════════════════════════════════════════
   SLIDE-OVER — contextual partner profile panel
   (transform-only animation → GPU compositing, no layout thrash)
══════════════════════════════════════════════════════════════════ */
.so-scrim {
  position: fixed; inset: 0; z-index: 100; background: var(--scrim);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  opacity: 0; pointer-events: none; transition: opacity 0.3s var(--ease-glide);
}
.so-scrim.open { opacity: 1; pointer-events: auto; }
.slideover {
  position: fixed; inset: 0; z-index: 110;
  /* Full-screen immersive takeover — the half-width panel left the dimmed
     grid peeking through and read as a broken layout. Content lives in a
     centered column (.so-inner) so wide monitors don't stretch fields. */
  width: 100vw;
  background: var(--bg);
  box-shadow: var(--el-4);
  transform: translateX(103%); will-change: transform;
  transition: transform 0.42s var(--ease-swift);
  display: flex; flex-direction: column;
}
.slideover.open { transform: translateX(0); }
.so-scroll { overflow-y: auto; flex: 1; overscroll-behavior: contain; }
.so-inner { max-width: 1160px; width: 100%; margin: 0 auto; padding: 0 var(--sp-6) var(--sp-8); }

/* Profile header — dynamic accent ribbon tinted by partner stage */
.so-head {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-6);
  margin: 0 calc(-1 * var(--sp-6)) var(--sp-5);
  background: var(--glass);
  -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.so-head::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 4px;
  background: linear-gradient(90deg, var(--dyn), transparent 85%);
}
.so-title h2 { margin: 0; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.so-title .meta { font-size: var(--fs-sm); color: var(--muted); font-weight: 600; margin-top: 4px; }
.so-title .meta .sep { margin: 0 7px; color: var(--faint); }
.so-actions { margin-left: auto; display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.so-close {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
  background: var(--card); cursor: pointer; font-size: 15px; color: var(--ink-soft);
  display: grid; place-items: center;
  transition: transform 0.25s var(--ease-spring), background 0.15s ease, color 0.15s ease;
}
.so-close:hover { transform: rotate(90deg) scale(1.06); color: var(--critical); }

.stage-badge {
  display: inline-block; padding: 5px 13px; border-radius: var(--r-pill);
  font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.02em; white-space: nowrap;
}
.stage-badge.text-dark { color: var(--badge-on-dim); }
.stage-badge.text-light { color: var(--badge-on-bright); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 15px; border-radius: var(--r-pill); border: 1px solid var(--border);
  background: var(--card); color: var(--ink-soft); font-weight: 800; font-size: var(--fs-sm);
  cursor: pointer; box-shadow: var(--el-1);
  transition: transform 0.25s var(--ease-spring), box-shadow 0.25s var(--ease-glide), background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: var(--el-2); }
.btn:active { transform: scale(0.96); }
.btn--primary { background: var(--dyn); border-color: var(--dyn); color: #fff; }
.btn--danger:hover { color: var(--critical); border-color: var(--critical-border); }

/* ── Flags callout ──────────────────────────────────────────────── */
.flags-callout {
  border: 1px solid var(--critical-border); background: var(--critical-bg);
  border-radius: var(--r-lg); padding: var(--sp-4) var(--sp-5); margin-bottom: var(--sp-5);
}
.flags-callout.is-clean { border-color: var(--good-border); background: var(--good-bg); }
.flags-callout h4 { margin: 0 0 var(--sp-2); font-size: var(--fs-sm); font-weight: 800; color: var(--critical); }
.flags-callout.is-clean h4 { color: var(--good); }
.flags-callout ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; }
.flags-callout li { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.5; display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap; }
.flag-text { flex: 1 1 200px; }
.flag-resolve-btn {
  flex: none; border: 1px solid var(--border); background: var(--card);
  border-radius: var(--r-pill); padding: 4px 11px;
  font-size: 10px; font-weight: 800; cursor: pointer; color: var(--ink-soft);
  transition: border-color 0.15s ease, color 0.15s ease, transform 0.2s var(--ease-spring); font-family: inherit;
}
.flag-resolve-btn:hover { border-color: var(--good-border); color: var(--good); transform: scale(1.04); }
.resolved-flags { margin-top: var(--sp-3); }
.resolved-flags summary {
  cursor: pointer; font-size: var(--fs-xs); font-weight: 700; color: var(--muted);
  padding: var(--sp-2) 0; user-select: none; list-style: none;
  display: flex; align-items: center; gap: var(--sp-2);
}
.resolved-flags summary::-webkit-details-marker { display: none; }
.resolved-flags summary::before { content: "▸ "; transition: transform 0.2s; display: inline-block; }
details[open].resolved-flags > summary::before { transform: rotate(90deg); }
.resolved-flag-item {
  margin-top: var(--sp-2); padding: var(--sp-3) var(--sp-4);
  background: var(--bg-deep); border: 1px solid var(--border);
  border-radius: var(--r-sm); font-size: var(--fs-xs); color: var(--ink-soft);
}
.resolved-flag-name { font-weight: 800; color: var(--good); margin-bottom: 3px; }
.resolved-flag-note { font-weight: 600; }
.resolved-flag-date { color: var(--muted); margin-top: 3px; font-weight: 700; }
.flags-callout .clean-note { margin: 0; font-size: var(--fs-sm); color: var(--ink-soft); }
.tier-label {
  display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 0.06em;
  text-transform: uppercase; border: 1px solid; border-radius: 5px;
  padding: 1px 7px; margin-right: 8px; vertical-align: 1px;
}

/* ══════════════════════════════════════════════════════════════════
   ACTION CENTER — AI agenda as an interactive timeline
══════════════════════════════════════════════════════════════════ */
.action-center {
  border: 1px solid var(--border); background: var(--card);
  border-radius: var(--r-lg); box-shadow: var(--el-1);
  margin-bottom: var(--sp-5); overflow: hidden;
}
.ac-toggle {
  width: 100%; display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5); border: 0; cursor: pointer; text-align: left;
  background: linear-gradient(90deg, var(--dyn-soft), transparent 70%);
  font-weight: 800; font-size: var(--fs-md); color: var(--ink);
}
.ac-toggle .ai-badge {
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  background: var(--dyn); color: #fff; border-radius: 5px; padding: 2px 8px;
}
.ac-toggle .chev { margin-left: auto; color: var(--muted); transition: transform 0.3s var(--ease-spring); }
.ac-toggle[aria-expanded="true"] .chev { transform: rotate(180deg); }
.ac-body { padding: var(--sp-2) var(--sp-5) var(--sp-5); }

/* Vertical timeline rail with numbered nodes */
.ac-timeline { position: relative; margin: var(--sp-3) 0 0; padding: 0; list-style: none; }
.ac-timeline::before {
  content: ""; position: absolute; left: 15px; top: 14px; bottom: 14px; width: 2px;
  background: linear-gradient(var(--dyn), var(--border));
  opacity: 0.5;
}
.ac-item { position: relative; padding: 0 0 var(--sp-5) 48px; animation: cardIn 0.4s var(--ease-glide) both; }
.ac-item:last-child { padding-bottom: var(--sp-2); }
.ac-node {
  position: absolute; left: 0; top: 0; width: 32px; height: 32px; border-radius: 50%;
  background: var(--card); border: 2px solid var(--dyn); color: var(--dyn);
  display: grid; place-items: center; font-size: 12px; font-weight: 800;
  box-shadow: 0 0 0 4px var(--bg), var(--el-1);
}
.ac-discussion { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.55; }
.ac-action-row {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: var(--r-md);
}
.ac-action-label {
  flex: none; font-size: 10px; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--dyn);
}
.ac-action-text { flex: 1 1 220px; font-size: var(--fs-sm); font-weight: 700; color: var(--ink); line-height: 1.45; }
.ac-owner { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
/* Complete button: outline circle → fills good-green on hover/checked */
.ac-check {
  width: 30px; height: 30px; flex: none; border-radius: 50%;
  border: 2px solid var(--border-strong); background: var(--card);
  color: transparent; font-size: 13px; font-weight: 800; cursor: pointer;
  display: grid; place-items: center;
  transition: transform 0.25s var(--ease-spring), border-color 0.15s ease,
              background 0.15s ease, color 0.15s ease;
}
.ac-check:hover { border-color: var(--good); color: var(--good); transform: scale(1.1); }
.ac-check:active { transform: scale(0.92); }
.ac-completed-row {
  display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
  margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  border: 1px dashed var(--good-border); background: var(--good-bg);
  border-radius: var(--r-md); font-size: var(--fs-sm); font-weight: 700; color: var(--good);
}
.ac-completed-row .btn { margin-left: auto; }
.ac-empty-note { font-size: var(--fs-sm); font-weight: 700; color: var(--good); padding: var(--sp-3) 0; }

/* Nonprofit status editor: checkbox toggle + editable status text */
.np-edit-row { display: flex; align-items: flex-start; gap: var(--sp-3); }
.np-edit-row label {
  display: inline-flex; align-items: center; gap: 7px; flex: none;
  font-size: var(--fs-xs); font-weight: 700; color: var(--ink-soft);
  padding-top: 9px; cursor: pointer; user-select: none;
}
.np-edit-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--good); cursor: pointer; }
.np-hint { font-size: var(--fs-xs); color: var(--muted); font-weight: 600; margin-top: 5px; }
.owner-select {
  border: 1px solid var(--border); background: var(--card); color: var(--ink);
  border-radius: var(--r-sm); padding: 6px 9px; font-size: var(--fs-xs); font-weight: 700; cursor: pointer;
  transition: border-color 0.15s ease, box-shadow 0.2s ease;
}
.owner-select:hover { border-color: var(--border-strong); box-shadow: var(--el-1); }
.owner-avatar-slot { width: 26px; }
.owner-avatar-slot .avatar--sm { animation: chipIn 0.35s var(--ease-spring) both; }
.ac-footnote { margin: var(--sp-4) 0 0; font-size: var(--fs-xs); color: var(--muted); font-weight: 600; line-height: 1.5; }

/* ══════════════════════════════════════════════════════════════════
   PROFILE SECTION CARDS & FIELDS
══════════════════════════════════════════════════════════════════ */
.section-grid { display: grid; gap: var(--sp-4); grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .section-grid { grid-template-columns: 1fr; } }
.section-card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
  padding: var(--sp-5); box-shadow: var(--el-1);
}
.section-card.full-width { grid-column: 1 / -1; }
.section-card h3 {
  margin: 0 0 var(--sp-4); font-size: var(--fs-sm); font-weight: 800;
  letter-spacing: 0.07em; text-transform: uppercase; color: var(--dyn);
  padding-bottom: var(--sp-2); border-bottom: 1px solid var(--border);
}
.field-grid { display: grid; gap: var(--sp-4); }
.field-grid--3col { grid-template-columns: 1fr 1fr 1fr; }
@media (max-width: 720px) { .field-grid--3col { grid-template-columns: 1fr; } }
.field-label { font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.field-value { font-size: var(--fs-sm); color: var(--ink); font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.field-value.missing { color: var(--critical); font-style: italic; font-weight: 600; }
.summary-bullets { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.summary-bullets li { font-size: var(--fs-sm); color: var(--ink); font-weight: 600; line-height: 1.5; }
.tag-list { display: flex; flex-wrap: wrap; gap: 7px; }
.tag {
  display: inline-block; padding: 4px 11px; border-radius: var(--r-pill);
  background: var(--accent-soft); color: var(--accent-dark);
  border: 1px solid var(--border); font-size: var(--fs-xs); font-weight: 700;
}
.tag-need { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.nonprofit-status-row { display: flex; align-items: center; gap: 8px; }
.checkbox-indicator {
  width: 17px; height: 17px; flex: none; border-radius: 5px;
  border: 1.5px solid var(--border-strong); display: grid; place-items: center;
  font-size: 11px; font-weight: 800; color: #fff;
}
.checkbox-indicator.is-checked { background: var(--good); border-color: var(--good); }
.onepager-link { font-size: var(--fs-sm); font-weight: 700; text-decoration: none; }
.onepager-link:hover { text-decoration: underline; }

/* Inline edit mode */
.edit-input {
  width: 100%; border: 1.5px solid var(--border-strong); border-radius: var(--r-sm);
  background: var(--card); color: var(--ink);
  padding: 8px 10px; font-size: var(--fs-sm); font-weight: 600;
  transition: border-color 0.15s ease, box-shadow 0.2s ease;
}
.edit-input:focus { outline: none; border-color: var(--dyn); box-shadow: 0 0 0 3px var(--dyn-soft); }
textarea.edit-input { resize: vertical; line-height: 1.5; }

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%; pointer-events: none;
  background: currentColor; opacity: 0.18; transform: scale(0);
  animation: rippleGo 0.6s var(--ease-glide) forwards;
}
@keyframes rippleGo { to { transform: scale(2.4); opacity: 0; } }

/* ══════════════════════════════════════════════════════════════════
   RESPONSIVE & MOTION SAFETY
══════════════════════════════════════════════════════════════════ */
@media (max-width: 1100px) {
  .metric-card { grid-column: span 4; }
  .metric-card--donut, .metric-card--flags { grid-column: span 6; }
}
@media (max-width: 760px) {
  #app { padding: 0 var(--sp-3) var(--sp-8); }
  .app-header { flex-wrap: wrap; padding: var(--sp-3); }
  .clock { display: none; }
  .metric-card { grid-column: span 6; }
  .metric-card--donut, .metric-card--flags { grid-column: span 12; }
  .so-head { flex-wrap: wrap; }
  .so-actions { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  html { scroll-behavior: auto; }
}

/* ══════════════════════════════════════════════════════════════════
   SHARED MODAL OVERLAY — demo modal & resolve modal
══════════════════════════════════════════════════════════════════ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: var(--scrim);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s var(--ease-glide);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r-xl); padding: var(--sp-7);
  box-shadow: var(--el-4); max-width: 480px; width: calc(100% - 48px);
  animation: cardIn 0.35s var(--ease-spring) both;
}
.modal-box h3 { margin: 0 0 var(--sp-3); font-size: var(--fs-md); font-weight: 800; }
.modal-box p { margin: 0 0 var(--sp-5); font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.6; }
.modal-icon { font-size: 26px; margin-bottom: var(--sp-3); display: block; }
.modal-actions { display: flex; gap: var(--sp-2); justify-content: flex-end; }
.modal-input {
  width: 100%; border: 1.5px solid var(--border-strong); border-radius: var(--r-sm);
  background: var(--card); color: var(--ink);
  padding: 10px 12px; font-size: var(--fs-sm); font-weight: 600;
  margin-bottom: var(--sp-4); resize: vertical; line-height: 1.5;
  transition: border-color 0.15s ease, box-shadow 0.2s ease; font-family: inherit;
}
.modal-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.modal-label { font-size: var(--fs-xs); font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: var(--sp-2); display: block; }

/* ══════════════════════════════════════════════════════════════════
   FOLLOW-UP TRACKER — action-item rows + status badges
══════════════════════════════════════════════════════════════════ */
.fu-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: var(--r-pill);
  font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
  white-space: nowrap; flex: none; border: 1px solid;
}
.fu-badge--overdue  { background: var(--critical-bg); color: var(--critical); border-color: var(--critical-border); }
.fu-badge--due-soon { background: var(--warn-bg);     color: var(--warn);     border-color: var(--warn-border); }
.fu-badge--on-track { background: var(--good-bg);     color: var(--good);     border-color: var(--good-border); }
.fu-row {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md);
  padding: var(--sp-4); margin-bottom: var(--sp-2); box-shadow: var(--el-1);
  animation: cardIn 0.35s var(--ease-glide) both; display: flex; flex-direction: column; gap: var(--sp-3);
}
.fu-row-top { display: flex; align-items: flex-start; gap: var(--sp-3); flex-wrap: wrap; }
.fu-row-org { font-weight: 800; font-size: var(--fs-sm); cursor: pointer; color: var(--accent); flex: none; background: none; border: none; padding: 0; font-family: inherit; }
.fu-row-org:hover { text-decoration: underline; }
.fu-item-text { font-size: var(--fs-sm); color: var(--ink-soft); line-height: 1.5; flex: 1 1 200px; }
.fu-row-bottom { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.fu-owner-select {
  border: 1px solid var(--border); background: var(--card); color: var(--ink);
  border-radius: var(--r-sm); padding: 5px 9px; font-size: var(--fs-xs); font-weight: 700; cursor: pointer;
  transition: border-color 0.15s ease; font-family: inherit;
}
.fu-owner-select:hover { border-color: var(--border-strong); }
.fu-avatar-slot { width: 26px; }

/* ══════════════════════════════════════════════════════════════════
   MEETING PREP OVERLAY — print-ready focus view
══════════════════════════════════════════════════════════════════ */
.prep-overlay {
  position: fixed; inset: 0; z-index: 115;
  background: var(--bg);
  transform: translateY(102%); will-change: transform;
  transition: transform 0.42s var(--ease-swift);
  display: flex; flex-direction: column;
}
.prep-overlay.open { transform: translateY(0); }
.prep-scroll { overflow-y: auto; flex: 1; }
.prep-inner { max-width: 860px; width: 100%; margin: 0 auto; padding: var(--sp-7) var(--sp-6) var(--sp-8); }
.prep-header {
  display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4);
  margin-bottom: var(--sp-6); padding-bottom: var(--sp-4);
  border-bottom: 2px solid var(--border);
}
.prep-title h2 { margin: 0 0 4px; font-size: var(--fs-xl); font-weight: 800; letter-spacing: -0.02em; }
.prep-title .prep-meta { font-size: var(--fs-sm); color: var(--muted); font-weight: 600; }
.prep-actions { display: flex; gap: var(--sp-2); align-items: center; flex: none; }
.prep-section { margin-bottom: var(--sp-6); }
.prep-section-head {
  font-size: var(--fs-xs); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 var(--sp-3); padding-bottom: var(--sp-2);
  border-bottom: 1px solid var(--border);
}
.prep-flag-item {
  display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap;
  padding: var(--sp-2) 0; border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
}
.prep-flag-item:last-child { border-bottom: none; }
.prep-flag-name { font-weight: 800; flex: none; }
.prep-flag-desc { color: var(--ink-soft); font-weight: 600; line-height: 1.45; flex: 1 1 200px; }
.prep-clean { font-size: var(--fs-sm); color: var(--good); font-weight: 700; padding: var(--sp-2) 0; }
.prep-agenda .ac-timeline::before { background: linear-gradient(var(--prep-dyn, var(--accent)), var(--border)); }

/* Print: show only the prep overlay content, clean for paper */
@media print {
  body > *:not(.prep-overlay) { display: none !important; }
  .prep-overlay {
    position: static !important; transform: none !important;
    background: #fff !important; display: block !important;
  }
  .prep-actions { display: none !important; }
  .prep-inner { max-width: 100%; padding: 16px; }
  .prep-section { page-break-inside: avoid; }
  .prep-title h2, .prep-section-head, .prep-flag-name { color: #000 !important; }
  .prep-meta, .prep-flag-desc, .ac-discussion { color: #333 !important; }
  .tier-label, .fu-badge { border: 1px solid #999 !important; color: #000 !important; background: #eee !important; }
  .ac-node { border-color: #666 !important; color: #333 !important; box-shadow: none !important; background: #fff !important; }
  .ac-timeline::before { background: #ccc !important; }
}

<script>
(function () {
  "use strict";

  /* ╔══════════════════════════════════════════════════════════════════════╗
     ║  SECURITY CONSIDERATIONS — REVIEW BEFORE CONNECTING TO LIVE BACKEND ║
     ╚══════════════════════════════════════════════════════════════════════╝

     These issues exist in the current implementation and must be addressed
     by the engineering team before this file is wired to a live data source.

     1. XSS via innerHTML: Partner data is rendered into the DOM via
        innerHTML throughout (renderGrid, renderSlideOver, renderFlagsPage,
        renderMeetingsPage, renderFollowupsPage, etc.). Although escapeHtml()
        and escapeAttr() are applied to most string fields, any field that
        bypasses these helpers or receives unescaped HTML from a POST payload
        is an XSS vector. Audit every innerHTML assignment once real data
        flows in, and consider using textContent or a sanitization library
        (e.g. DOMPurify) for all user-supplied content.

     2. No input validation on edit fields: saveProfileEdits() reads values
        directly from edit-input elements and writes them back into the
        in-memory PARTNERS array. There is no server-side validation, no
        type checking beyond the basic parseInt() for numeric fields, and no
        schema enforcement. Malicious or malformed inputs will persist in
        the session store. Add server-side validation on every POST path.

     3. No authentication / authorization: This file has no session checks,
        no role-based access control, and no CSRF protection. Any user who
        can load the URL can read all partner data and trigger edits. Before
        production, gate the file behind SSO (e.g. Okta, Microsoft Entra)
        and add CSRF tokens to all write endpoints.

     4. Partner data loaded into a public JS variable: Once PARTNERS is
        populated from a backend, all records are exposed in the browser's
        JS memory and DevTools console. If the deployment includes sensitive
        financial or contact data, consider server-side rendering or lazy
        loading individual records only when a profile is opened.

     5. CSV export has no rate-limiting: exportCsv() fires on a simple
        button click with no throttle. In a multi-user environment, a
        malicious user could scrape the full partner list rapidly. Add
        server-side rate limiting and audit logging on export endpoints.

     6. localStorage / sessionStorage not used (intentional): The current
        implementation stores all state in JS memory. This means edits do
        not survive a page reload. The backend integration must handle
        persistence. Do not add localStorage without considering the privacy
        implications of caching partner PII in the browser.

     7. Flag resolution and follow-up state are session-only: FLAG_RESOLVED,
        FOLLOWUP_OWNERS, and FOLLOWUP_RESOLVED_SET reset on every reload.
        Resolved flags and owner assignments are not persisted. The backend
        integration must add write-back endpoints for these actions.
  ══════════════════════════════════════════════════════════════════════ */

  /* =====================================================
     REFERENCE DATE — anchor for all "days since" / "days
     until" math. Update this to new Date() or inject from
     the backend when connecting to a live data source.
  ===================================================== */
  var REFERENCE_DATE = parseLocalDate("2026-06-30");

  /* =====================================================
     STATIC LOOKUP TABLES — stage ordering, styles, and
     flag metadata. These are load-bearing: do not rename
     keys that are referenced by STAGE_STYLE / TIER_STYLE.
  ===================================================== */
  var STAGE_ORDER = ["Discovery", "Natural History Study", "Preclinical", "Clinical Trials", "Approved Therapy"];

  /* Month name arrays — used by renderMeetingsPage; defined at module level
     so they are not recreated on every call. */
  var MONTHS_FULL = ["January","February","March","April","May","June",
                     "July","August","September","October","November","December"];
  var MONTHS_ABBR = ["Jan","Feb","Mar","Apr","May","Jun",
                     "Jul","Aug","Sep","Oct","Nov","Dec"];

  var STAGE_STYLE = {
    "Discovery":              { color: "var(--stage-1)", text: "dark"  },
    "Natural History Study":  { color: "var(--stage-2)", text: "dark"  },
    "Preclinical":            { color: "var(--stage-3)", text: "dark"  },
    "Clinical Trials":        { color: "var(--stage-4)", text: "light" },
    "Approved Therapy":       { color: "var(--stage-5)", text: "light" }
  };

  var FLAG_META = {
    no_research_contact: {
      label: "No Research Contact",
      tier: "medium",
      desc: function (p) { return "No named contact exists for " + p.disease + " research activity, so RTWF can't route trial updates or scientific news directly."; }
    },
    prevalence_unknown: {
      label: "Prevalence Unknown",
      tier: "info",
      desc: function (p) { return "Documented prevalence for " + p.disease + " hasn't been established yet, which limits funding prioritization and registry planning."; }
    },
    new_foundation: {
      label: "Brand-New Foundation",
      tier: "info",
      desc: function (p) { return "Onboarded as an RTWF partner within the last year — relationship history is still thin and the standard intake checklist isn't fully complete."; }
    },
    stale_contact: {
      label: "No Recent Contact",
      tier: "critical",
      desc: function (p) { return "No interaction has been logged in " + daysSince(p.lastInteraction) + " days, well past RTWF's standard outreach cadence."; }
    },
    funding_gap: {
      label: "Funding Ask Unaddressed",
      tier: "critical",
      desc: function (p) { return "An open funding ask (" + p.data.funding.currentAsk + ") has gone " + daysSince(p.data.funding.askDate) + " days without a logged follow-up."; }
    },
    no_materials: {
      label: "No Shared Materials",
      tier: "medium",
      desc: function () { return "No one-pagers, decks, or intake materials have been exchanged with this partner yet."; }
    }
  };

  var TIER_RANK = { critical: 3, medium: 2, info: 1 };
  var TIER_LABEL = { critical: "Critical", medium: "Medium", info: "Info" };
  var TIER_STYLE = {
    critical: { color: "var(--critical)", bg: "var(--critical-bg)", border: "var(--critical-border)" },
    medium:   { color: "var(--warn)",     bg: "var(--warn-bg)",     border: "var(--warn-border)" },
    info:     { color: "var(--info)",     bg: "var(--info-bg)",     border: "var(--info-border)" }
  };

  function highestTier(p) {
    var best = null;
    getActiveFlags(p).forEach(function (f) {
      var t = FLAG_META[f].tier;
      if (!best || TIER_RANK[t] > TIER_RANK[best]) best = t;
    });
    return best;
  }

  /* ══════════════════════════════════════════════════════════════════
     INTEGRATION SURFACE — PARTNER DATA SCHEMA
     ──────────────────────────────────────────────────────────────────
     PARTNERS is populated by external form submissions and API
     connectors. Each record must conform to the following shape.
     POST valid partner objects to this array (or replace it entirely)
     from your backend connector.

     Required top-level fields
     ─────────────────────────
     id              {string}   Unique slug, e.g. "batten" or "npc".
                                Used as a stable key for session state.
     orgName         {string}   Full legal name of the partner organization.
     orgType         {string}   Category, e.g. "Patient Advocacy Nonprofit",
                                "Research Foundation", "International Alliance",
                                "Family-Led Nonprofit", "All-Volunteer Foundation",
                                "Global Patient Network".
     region          {string}   Geographic region, e.g. "Northeast US",
                                "West Coast US", "International / Europe",
                                "Canada", "Asia-Pacific", "Latin America".
     diseaseCategory {string}   Broad disease class, e.g. "Neurodegenerative",
                                "Metabolic", "Neuromuscular", "Multisystem".
     disease         {string}   Full disease name as it appears in the UI.
     stage           {string}   One of exactly five values (case-sensitive):
                                "Discovery" | "Natural History Study" |
                                "Preclinical" | "Clinical Trials" |
                                "Approved Therapy"
     topNeed         {string}   Primary support need, e.g. "Patient Registry
                                Support", "Research Funding", "Caregiver Support
                                Network", "Newborn Screening Advocacy".
     lastInteraction {string}   ISO date string "YYYY-MM-DD". Drives "days since"
                                calculations and the stale_contact flag.
     flags           {string[]} Array of zero or more flag keys. Valid keys:
                                "no_research_contact" | "prevalence_unknown" |
                                "new_foundation" | "stale_contact" |
                                "funding_gap" | "no_materials"
     followUpOpen    {boolean}  true if an open follow-up action exists for
                                this partner.

     data object (nested)
     ────────────────────
     data.contact
       name    {string}          Primary contact full name.
       title   {string}          Job title.
       email   {string}          Email address.
       phone   {string}          Phone number (any format).

     data.account
       founded         {string}  Founding year, e.g. "1987".
       website         {string}  Domain only, e.g. "bdsalliance.org".
       budget          {string}  Budget description, e.g. "$2.1M annual".
       staff           {string}  Staff description, e.g. "14 FTE".
       ein             {string}  EIN number, e.g. "78-1809130".
       nonprofitStatus {string}  Status string, e.g. "501(c)(3) — Active" or
                                 "501(c)(3) — Application Pending" or a
                                 fiscal-sponsorship description.

     data.disease
       gene          {string}   Primary causative gene(s), e.g. "CLN3".
       prevalence    {string}   Prevalence statement, e.g. "1 in 25,000".
                                If unknown, use a descriptive string and add
                                "prevalence_unknown" to flags[].
       inheritance   {string}   Pattern, e.g. "Autosomal recessive".
       summary       {string}   1–3 sentence disease summary.
       treatment     {string}   Approved or investigational treatment
                                description. Null / "No approved therapy" if none.
       standardOfCare {string}  Current standard of care description.

     data.research
       activeTrials     {number}    Count of active clinical trials (0 or more).
       leadInstitutions {string[]}  Academic / clinical lead institution names.
       researchContact  {string|null} Named research liaison. null if missing
                                     (triggers "no_research_contact" flag).
       industryPartners {string[]}  Pharma / biotech partner names and programs.

     data.funding
       totalRaised        {string}       Lifetime amount, any currency/format.
       sources            {string[]}     Funding source descriptions.
       currentAsk         {string}       Current ask description, or "No open ask".
       askDate            {string|null}  ISO date "YYYY-MM-DD" or null.
       hasOpenAsk         {boolean}      true if an active ask exists.
       grantCyclesFunded  {string}       Description of past cycles, e.g.
                                         "5 cycles (2019, 2021, 2022, 2024, 2026)".

     data.support
       secondary {string[]}  Secondary support needs.
       notes     {string}    Free-text notes about support context.

     data.materials
       shared {string[]}  Materials already exchanged with the partner.
       needed {string[]}  Materials still needed / gaps.

     data.meeting
       last        {string}    ISO date "YYYY-MM-DD" of the last meeting.
       next        {string|null} ISO date of the next scheduled meeting,
                                 or null if unscheduled.
       cadence     {string}    Meeting cadence. Valid values for the schedule
                               automation copy:
                               "Monthly" | "Monthly (onboarding)" |
                               "Bi-monthly" | "Quarterly" |
                               "Quarterly (lapsed)" | "Semi-annual" |
                               "Not yet established"
       lastSummary {string[]}  Array of summary bullet strings from the

  ══════════════════════════════════════════════════════════════════ */
  var PARTNERS = [];
  /* =====================================================
     UTILITIES
  ===================================================== */
  function parseLocalDate(str) {
    if (!str) return null;

  }

  function formatDate(str) {
    if (!str) return null;

  function daysSince(str) {
    if (!str) return 0;
    var d = parseLocalDate(str);

  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function uniqueSorted(arr) {
    return Array.from(new Set(arr)).sort();
  }

  function escapeAttr(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function getPath(obj, path) {
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }

  function setPath(obj, path, value) {
    var parts = path.split(".");
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;
  }

  /* =====================================================

  ===================================================== */
  var STAGE_AGENDA_ITEM = {

        action: "Document any recruitment barriers reported across active trial sites."

    },

  var FLAG_AGENDA_ITEM = {
    no_research_contact: function (p) {

    prevalence_unknown: function (p) {

      };

    new_foundation: function () {

    funding_gap: function (p) {

    no_materials: function () {

      };

  function buildAgendaItems(p) {
    var items = [];

    if (p.flags.indexOf("stale_contact") !== -1) {
      items.push({
        discussion: "Re-open the conversation after an extended gap \u2014 the last logged contact was on " + formatDate(p.lastInteraction) + ". Lapsed contact like this raises the risk that priorities, leadership, or funding needs have shifted without RTWF's knowledge.",
        action: "Schedule a re-engagement call with " + p.orgName + " to confirm current priorities."

    items.push({
      discussion: "Confirm the date of the next meeting and any materials each side will send beforehand. Closing every meeting with clear next steps is what keeps a relationship moving instead of stalling between check-ins.",

  /* =====================================================

  var STAGE_ACCENT = {
    "Discovery":             "#4a7fb0",
    "Natural History Study": "#3a6f9f",
    "Preclinical":           "#2d6194",

  /* OWNER_OPTIONS — team member names that populate the "Assign owner"
     dropdowns in the Action Center and Follow-Ups page. Populate this

     Example: ["Taylor Brooks", "Jamie Ortiz", "Casey Lin"]          */
  var OWNER_OPTIONS = [];

  /* =====================================================
     STATE ENGINE — Proxy-backed reactive store + PubSub
     -----------------------------------------------------
     Components register via store.subscribe(keys, fn).
     Any mutation (state.search = "x") notifies exactly the
     subscribers of that key. Renders are batched through a
     microtask so a burst of mutations (e.g. "clear all
     filters") produces a single repaint per component.
  ===================================================== */
  var store = (function () {
    var listeners = {};             // key -> [fn, fn, ...]
    var pending = new Set();        // fns queued for this microtask
    var flushScheduled = false;

    function flush() {
      flushScheduled = false;
      var run = Array.from(pending);
      pending.clear();
      run.forEach(function (fn) { fn(); });
    }

    function notify(key) {
      (listeners[key] || []).forEach(function (fn) { pending.add(fn); });
      if (!flushScheduled) {
        flushScheduled = true;
        // queueMicrotask keeps renders synchronous-feeling but batched
        (window.queueMicrotask || function (cb) { Promise.resolve().then(cb); })(flush);
      }
    }

    var state = new Proxy({
      search: "",
      stage: "",
      category: "",
      need: "",
      orgType: "",
      region: "",
      quick: "",                // "" | "upcoming" | "followups" | "flagged" — metric quick views
      sort: "flagged",          // "flagged" | "name" | "recent"
      paletteOpen: false,
      paletteIndex: 0,          // keyboard cursor within palette results
      activePartnerId: null,    // non-null => slide-over open
      editMode: false,
      agendaExpanded: true,     // Action Center opens expanded by default
      dataVersion: 0            // bump after a profile save to refresh derived views
    }, {
      set: function (target, key, value) {
        if (target[key] === value) return true;   // no-op writes don't re-render
        target[key] = value;
        notify(key);
        return true;
      }
    });

    return {
      state: state,
      subscribe: function (keys, fn) { keys.forEach(function (k) { (listeners[k] = listeners[k] || []).push(fn); }); }
    };
  })();
  var state = store.state;

  var FILTER_KEYS = ["search", "stage", "category", "need", "orgType", "region", "quick", "sort"];
  var currentEditPartner = null;   // partner object bound to the open profile
  var lastFocusedCard = null;      // focus restoration target when slide-over closes
  var prefersReducedMq = window.matchMedia("(prefers-reduced-motion: reduce)");
  var prefersReduced = prefersReducedMq.matches;
  prefersReducedMq.addEventListener("change", function (e) { prefersReduced = e.matches; });

  /* Action Center session memory: per-partner completed items + owner
     picks survive re-renders (edit mode, theme flips) within a session. */
  var AC_SESSION = {};
  function acFor(id) {
    return AC_SESSION[id] || (AC_SESSION[id] = { done: {}, owners: {} });
  }

  /* ── Flag & Follow-up resolution stores (session-only) ── */
  var FLAG_RESOLVED = {};          // { [partnerId]: { [flagKey]: { note, date } } }
  var FOLLOWUP_OWNERS = {};        // { [followupKey]: ownerName }
  var FOLLOWUP_RESOLVED_SET = {};  // { [followupKey]: true }

  /* Deterministic avatar: initials + a stable hue hashed from the name */
  function initialsOf(name) {
    var words = String(name || "?").trim().split(/\s+/);

    var b = words.length > 1 ? words[words.length - 1].charAt(0) : "";
    return (a + b).toUpperCase();
  }
  function hueOf(name) {
    var h = 0;
    var s = String(name || "");
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) % 360; }
    return h;
  }
  function avatarHtml(name, small) {

  function getFilteredPartners() {
    var term = state.search.trim().toLowerCase();
    return PARTNERS.filter(function (p) {
      if (state.quick && QUICK_MATCH[state.quick] && !QUICK_MATCH[state.quick](p)) return false;
      if (state.stage && p.stage !== state.stage) return false;
      if (state.category && p.diseaseCategory !== state.category) return false;
      if (state.need && p.topNeed !== state.need) return false;
      if (state.orgType && p.orgType !== state.orgType) return false;
      if (state.region && p.region !== state.region) return false;
      if (term) {
        var summaryText = Array.isArray(p.data.meeting.lastSummary)
          ? p.data.meeting.lastSummary.join(" ")

        var haystack = [
          p.orgName, p.disease, p.data.disease.gene, p.data.contact.name,
          p.stage, p.diseaseCategory, p.topNeed, p.region, p.orgType, summaryText

        if (haystack.indexOf(term) === -1) return false;

      return true;

  function sortPartners(list) {
    var sorted = list.slice();

  /* =====================================================

  ===================================================== */
  var DONUT_R = 42;
  var DONUT_C = 2 * Math.PI * DONUT_R; // ≈ 263.9 — matches the 264 in @keyframes donutDraw

  function donutSvg(stageCounts, total) {
    var offset = 0;
    var segs = STAGE_ORDER.map(function (s, i) {
      var count = stageCounts[s];
      if (!count) return "";
      var len = (count / total) * DONUT_C;
      // Each segment: dasharray = [its arc, rest of circle]; dashoffset walks
      // backwards around the ring. The donutDraw keyframe animates from a full
      // 264 offset down to this computed value => segments "draw in".
      var seg =
        '<circle class="donut-seg" cx="55" cy="55" r="' + DONUT_R + '" ' +
        'style="stroke:' + STAGE_STYLE[s].color + '; stroke-dasharray:' + len.toFixed(2) + ' ' + DONUT_C.toFixed(2) + '; ' +
        'stroke-dashoffset:' + (-offset).toFixed(2) + '; animation-delay:' + (i * 0.09) + 's;"></circle>';

  function renderMetrics() {

    var stageCounts = {};
    STAGE_ORDER.forEach(function (s) { stageCounts[s] = 0; });

  /* Count-up animation for headline metric numbers */
  function animateCount(el) {
    var target = parseInt(el.textContent, 10);
    if (isNaN(target) || prefersReduced) return;
    var duration = 900, start = null;
    function step(ts) {
      if (!start) start = ts;
      var progress = Math.min((ts - start) / duration, 1);
      var eased = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(eased * target);
      if (progress < 1) requestAnimationFrame(step);
      else el.textContent = target;
    }
    requestAnimationFrame(step);
  }

  /* CSV export of whatever the grid currently shows — filters included.
